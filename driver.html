<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>نقلي - السائق</title>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{background:#f0f2f5;margin:0;padding:12px}
.header{background:#0a1931;color:#fff;padding:18px;text-align:center;border-radius:0 0 18px 18px;margin:-12px -12px 15px -12px}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.06)}
input,select{width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:11px;margin:7px 0;font-size:15px}
.btn{width:100%;padding:14px;background:#0a1931;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-green{background:#27ae60}.btn-blue{background:#1a73e8}.btn-whats{background:#25D366}
.file-label{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px dashed #0a3d62;padding:12px;border-radius:10px;margin:7px 0;cursor:pointer}
.file-label.ok{border-color:#27ae60;background:#e8f5e9}
.link{text-align:center;color:#666;margin-top:12px;cursor:pointer;text-decoration:underline}
#regForm{display:none}
#imgModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center}
#imgModal img{max-width:92%;max-height:92%;border-radius:12px;border:3px solid #fff}
.eye{background:#0a3d62;color:#fff;padding:4px 10px;border-radius:6px;font-size:13px}
.acceptedBox{background:#fff;border:2px solid #27ae60;border-radius:16px;padding:18px;margin:12px 0}
.phoneNum{font-size:28px;font-weight:bold;color:#0a1931;direction:ltr;text-align:center;margin:12px 0;letter-spacing:1px}
.greenTop{background:#27ae60;color:#fff;padding:16px;border-radius:12px;text-align:center;font-size:18px;font-weight:bold;margin-bottom:12px}
</style>
</head>
<body>
<div class="header"><h2 style="margin:0">🚛 نقلي - السائق</h2></div>

<!-- 1. دخول السائق هو أول ما يظهر -->
<div class="card" id="loginCard">
<h3 style="margin-top:0">🔑 دخول السائق المعتمد</h3>
<input id="loginPhone" type="tel" placeholder="رقم الهاتف *">
<input id="loginPass" type="password" placeholder="كلمة السر *">
<button class="btn btn-green" id="loginBtn">دخول</button>
<div class="link" onclick="showRegister()">سائق جديد؟ سجل هنا ↓</div>
</div>

<!-- 2. تسجيل سائق جديد - مخفي حتى يضغط -->
<div class="card" id="regForm">
<h3 style="margin-top:0">📝 تسجيل سائق جديد</h3>
<input id="dName" placeholder="الاسم الكامل *">
<input id="dPhone" placeholder="رقم الهاتف *">
<input id="dPass" type="password" placeholder="كلمة السر *">
<select id="dVehicle"><option>تاكسي</option><option>واوا</option><option>شاحنة متوسطة 3 طن</option><option>شاحنة كبيرة 10 طن</option></select>
<input id="dPlate" placeholder="لوحة السيارة *">
<label>📸 صورة شخصية *</label>
<div class="file-label" id="label1"><span>اختر الصورة</span><span id="t1">📁</span></div>
<input type="file" id="dPhoto" accept="image/*" hidden>
<label>🪪 صورة بطاقة التعريف *</label>
<div class="file-label" id="label2"><span>اختر الصورة</span><span id="t2">📁</span></div>
<input type="file" id="dIdPhoto" accept="image/*" hidden>
<button class="btn" id="regBtn">إرسال للموافقة</button>
<div id="regMsg"></div>
<div class="link" onclick="showLogin()">لدي حساب؟ دخول ↑</div>
</div>

<div id="driverInfo"></div>
<div id="acceptedOrder"></div>
<div id="orders"></div>
<div id="imgModal" onclick="this.style.display='none'"><img id="modalImg"></div>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, getDocs, getDoc, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let url1="", url2="";
label1.onclick=()=>dPhoto.click(); label2.onclick=()=>dIdPhoto.click();
function compress(file){ return new Promise(res=>{ let r=new FileReader(); r.onload=e=>{ let img=new Image(); img.onload=()=>{ let c=document.createElement('canvas'); let w=img.width,h=img.height; if(w>600){h=h*600/w;w=600;} c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',0.5)); }; img.src=e.target.result; }; r.readAsDataURL(file); }); }

dPhoto.onchange=e=>{ let f=e.target.files[0]; if(!f) return; url1=URL.createObjectURL(f); label1.classList.add('ok'); t1.innerHTML=`✅ تم <span class="eye" onclick="event.stopPropagation(); show1()">👁️</span>`; };
dIdPhoto.onchange=e=>{ let f=e.target.files[0]; if(!f) return; url2=URL.createObjectURL(f); label2.classList.add('ok'); t2.innerHTML=`✅ تم <span class="eye" onclick="event.stopPropagation(); show2()">👁️</span>`; };
window.show1=()=>{ modalImg.src=url1; imgModal.style.display='flex'; }
window.show2=()=>{ modalImg.src=url2; imgModal.style.display='flex'; }
window.showRegister=()=>{ document.getElementById('regForm').style.display='block'; document.getElementById('loginCard').style.display='none'; }
window.showLogin=()=>{ document.getElementById('regForm').style.display='none'; document.getElementById('loginCard').style.display='block'; }

let curDriver=null;
regBtn.onclick=async()=>{
let name=dName.value.trim(), phone=dPhone.value.trim(), pass=dPass.value.trim(), vehicle=dVehicle.value, plate=dPlate.value.trim();
if(!name||!phone||!pass||!plate||!dPhoto.files[0]||!dIdPhoto.files[0]) return alert("⚠️ أكمل جميع البيانات والصور");
regMsg.textContent="⏳ جاري حفظ الصور...";
try{
let photoBase64=await compress(dPhoto.files[0]); let idPhotoBase64=await compress(dIdPhoto.files[0]);
await addDoc(collection(db,"drivers"),{name,phone,password:pass,vehicle,plate,photoBase64,idPhotoBase64,status:"pending",createdAt:new Date()});
regMsg.innerHTML="<div style='background:#e8f5e9;padding:10px;border-radius:10px;color:green'>✅ تم حفظ معلوماتك بأمان، انتظر الموافقة</div>";
}catch(e){ regMsg.textContent="خطأ: "+e.message; }
};

loginBtn.onclick=async()=>{
let phone=loginPhone.value.trim(), pass=loginPass.value.trim();
if(!phone||!pass) return alert("أدخل الرقم وكلمة السر");
let q=query(collection(db,"drivers"),where("phone","==",phone),where("password","==",pass));
let snap=await getDocs(q);
if(snap.empty) return alert("رقم أو كلمة السر خاطئة");
let d=snap.docs[0]; let o=d.data();
if(o.status!="approved") return alert("⏳ لم تتم الموافقة بعد من الأدمن");
curDriver={id:d.id,...o};
driverInfo.innerHTML=`<div class="card" style="border:2px solid #27ae60"><b>مرحبا ${o.name}</b> - ${o.vehicle} ✅</div>`;
loginCard.style.display='none'; regForm.style.display='none';
loadOrders();
};

async function loadOrders(){
let q=query(collection(db,"requests"),where("vehicle","==",curDriver.vehicle),where("status","==","new"));
let snap=await getDocs(q); let h="";
snap.forEach(s=>{ let o=s.data(); h+=`<div class="card"><b>${o.mouqataa} → ${o.destArea}</b><br>${o.goodsDesc||''}<br>💰 ${o.price} MRU<br><button class="btn btn-green" onclick="acceptOrder('${s.id}')">قبول الطلب</button></div>`; });
orders.innerHTML=h||"لا يوجد طلبات جديدة";
}

window.acceptOrder=async(id)=>{
let ref=doc(db,"requests",id); let snap=await getDoc(ref); let o=snap.data();
let customerPhone=o.customerPhone||o.phone||o.clientPhone||"";
let customerName=o.customerName||o.clientName||"الزبون";
await updateDoc(ref,{status:"accepted",driverName:curDriver.name,driverPhone:curDriver.phone,progress:50});
acceptedOrder.innerHTML=`
<div class="greenTop">✅ تم قبول الطلب</div>
<div class="acceptedBox">
<div style="color:#666;font-size:14px">رقم العميل</div>
<div class="phoneNum">${customerPhone}</div>
<p><b>العميل:</b> ${customerName}</p>
<p><b>المسار:</b> ${o.mouqataa} → ${o.destArea}</p>
<button class="btn btn-blue" onclick="window.location.href='tel:${customerPhone}'">📞 اتصال</button>
<button class="btn btn-whats" onclick="window.open('https://wa.me/${customerPhone.replace(/[^0-9]/g,'')}','_blank')">💬 واتساب</button>
<button class="btn" style="background:#eee;color:#333;margin-top:12px" onclick="acceptedOrder.innerHTML='';loadOrders()">رجوع للطلبات</button>
</div>`;
orders.innerHTML="";
};
</script>
</body>
</html>
