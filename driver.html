<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - السائق</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{background:#f0f2f5;margin:0;padding:12px}
.header{background:#0a1931;color:#fff;padding:18px;text-align:center;border-radius:0 0 18px 18px;margin:-12px -12px 15px -12px;position:sticky;top:0;z-index:20}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.new-order-anim{animation:pulse 1.2s infinite;border:2px solid #e74c3c}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(231,76,60,.7)}70%{box-shadow:0 0 0 12px rgba(231,76,60,0)}100%{box-shadow:0 0 0 0 rgba(231,76,60,0)}}
input,select{width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:11px;margin:7px 0}
.btn{width:100%;padding:14px;background:#0a1931;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-green{background:#27ae60}.btn-blue{background:#1a73e8}.btn-whats{background:#25D366}.btn-orange{background:#ff9800}.btn-gray{background:#eee;color:#333}
.link{color:#1a73e8;text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline;font-weight:bold;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">🚛 نقلي - السائق <span id="notifCount" style="background:#e74c3c;padding:3px 9px;border-radius:12px;font-size:13px;display:none">0</span></h2>
<button id="soundBtn" onclick="enableSound()" style="background:#fff;color:#0a1931;border:0;padding:7px 14px;border-radius:8px;margin-top:8px;font-weight:bold">🔔 فعل تنبيه الطلبات</button>
</div>

<div class="card" id="loginCard">
<h3>🔑 دخول السائق المعتمد</h3>
<input id="loginPhone" type="tel" placeholder="رقم الهاتف *">
<input id="loginPass" type="password" placeholder="كلمة السر *" autocomplete="off">
<button class="btn btn-green" id="loginBtn">دخول</button>
<div class="link" onclick="showForgot()">🔒 نسيت كلمة السر؟ SMS</div>
<div style="border-top:1px solid #eee;margin-top:15px;padding-top:10px">
<div class="link" onclick="showRegister()" style="color:#0a1931">➕ تسجيل سائق جديد (مع الوثائق المطلوبة)</div>
</div>
</div>

<div class="card hidden" id="forgotCard">
<h3>🔒 استرجاع كلمة السر بـ SMS</h3>
<div id="recaptcha-container"></div>
<input id="forgotPhone" type="tel" placeholder="222xxxxxxxx">
<button class="btn btn-blue" onclick="sendOTP()">📩 إرسال كود SMS</button>
<div id="otpBox" class="hidden">
<input id="otpCode" type="tel" placeholder="كود الـ 6 أرقام من SMS">
<input id="newPass1" type="password" placeholder="كلمة السر الجديدة">
<input id="newPass2" type="password" placeholder="تأكيد كلمة السر الجديدة">
<button class="btn btn-orange" onclick="verifyOTP()">✅ تأكيد وتغيير</button>
</div>
<div class="link" onclick="showLogin()">⬅️ رجوع</div>
</div>

<div class="card hidden" id="registerCard">
<h3>📝 تسجيل سائق جديد - الوثائق المطلوبة</h3>
<input id="regName" placeholder="الاسم الكامل *">
<input id="regPhone" type="tel" placeholder="رقم الهاتف *">
<input id="regPass" type="password" placeholder="كلمة السر *">
<input id="regPassConfirm" type="password" placeholder="تأكيد كلمة السر *">
<select id="regVehicle"><option>تاكسي</option><option>واوا</option><option>شاحنة متوسطة 3 طن</option><option>شاحنة كبيرة 10 طن</option></select>
<input id="regPlate" placeholder="رقم اللوحة *">
<label style="font-size:13px;font-weight:bold">صورة شخصية *</label><input type="file" id="regPhoto" accept="image/*">
<label style="font-size:13px;font-weight:bold">بطاقة تعريف / رخصة *</label><input type="file" id="regIdPhoto" accept="image/*">
<label style="font-size:13px;font-weight:bold">بطاقة رمادية *</label><input type="file" id="regGrayCard" accept="image/*">
<button class="btn btn-green" id="regBtn">📤 إرسال الطلب</button>
<div class="link" onclick="showLogin()">⬅️ رجوع للدخول</div>
</div>

<div id="driverInfo"></div>
<div id="acceptedOrder"></div>
<div id="driverMap" style="height:380px;border-radius:12px;display:none;margin:12px 0;border:2px solid #0a3d62"></div>
<div id="orders"></div>

<audio id="orderSound" src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_2a6e1f5b7c.mp3" preload="auto" loop></audio>

<script type="module">
import { db } from "./firebase.js";
import { collection, query, where, getDocs, getDoc, doc, updateDoc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const auth = getAuth();
let curDriver=null, map=null, driverMarker=null, custMarker=null, trackingInterval=null, lastOrderCount=0, soundEnabled=false;
let confirmationResult=null, routeLine=null;

window.enableSound=()=>{
  soundEnabled=true;
  let a=document.getElementById('orderSound'); a.play().then(()=>a.pause());
  document.getElementById('soundBtn').textContent="✅ التنبيه مفعل";
  document.getElementById('soundBtn').style.background="#27ae60"; document.getElementById('soundBtn').style.color="#fff";
  if(Notification && Notification.permission!=="granted") Notification.requestPermission();
}

window.showLogin=()=>{ loginCard.classList.remove('hidden'); forgotCard.classList.add('hidden'); registerCard.classList.add('hidden'); document.getElementById('otpBox').classList.add('hidden'); }
window.showForgot=()=>{ loginCard.classList.add('hidden'); forgotCard.classList.remove('hidden'); registerCard.classList.add('hidden'); }
window.showRegister=()=>{ loginCard.classList.add('hidden'); forgotCard.classList.add('hidden'); registerCard.classList.remove('hidden'); }

function toBase64(f){ return new Promise(r=>{ let fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); }); }

// دخول
loginBtn.onclick=async()=>{
  let phone=loginPhone.value.trim(), pass=loginPass.value.trim();
  if(!phone||!pass) return alert("أدخل البيانات");
  let snap=await getDocs(query(collection(db,"drivers"),where("phone","==",phone),where("password","==",pass)));
  if(snap.empty) return alert("رقم أو كلمة سر خاطئة");
  if(snap.docs[0].data().status!="approved") return alert("⏳ بانتظار الموافقة");
  curDriver={id:snap.docs[0].id,...snap.docs[0].data()};
  loginPass.value=""; loginCard.style.display='none';
  driverInfo.innerHTML=`<div class="card" style="border:2px solid #27ae60"><b>مرحبا ${curDriver.name}</b> - ${curDriver.vehicle} ✅<br><small>ربحك 90% - عمولة 10%</small></div>`;
  listenOrders(); initMap();
};

// SMS استرجاع
window.sendOTP=async()=>{
  let phoneRaw=document.getElementById('forgotPhone').value.trim();
  if(phoneRaw.length<8) return alert("أدخل رقم صحيح");
  let q=query(collection(db,"drivers"),where("phone","==",phoneRaw));
  let snap=await getDocs(q);
  if(snap.empty) return alert("رقم غير مسجل");
  let phone='+222'+phoneRaw.replace(/^222/,'');
  window.recaptchaVerifier=new RecaptchaVerifier(auth,'recaptcha-container',{size:'normal'});
  confirmationResult=await signInWithPhoneNumber(auth,phone,window.recaptchaVerifier);
  alert("تم إرسال SMS إلى "+phone);
  document.getElementById('otpBox').classList.remove('hidden');
}
window.verifyOTP=async()=>{
  let code=document.getElementById('otpCode').value.trim(), p1=document.getElementById('newPass1').value.trim(), p2=document.getElementById('newPass2').value.trim();
  if(p1!==p2) return alert("كلمتا السر غير متطابقتين");
  try{
    await confirmationResult.confirm(code);
    let phoneRaw=document.getElementById('forgotPhone').value.trim();
    let q=query(collection(db,"drivers"),where("phone","==",phoneRaw));
    let snap=await getDocs(q);
    await updateDoc(doc(db,"drivers",snap.docs[0].id),{password:p1});
    alert("✅ تم تغيير كلمة السر"); showLogin();
  }catch(e){ alert("كود خاطئ"); }
}

// تسجيل جديد
regBtn.onclick=async()=>{
  let name=regName.value.trim(), phone=regPhone.value.trim(), pass=regPass.value.trim(), pass2=regPassConfirm.value.trim(), vehicle=regVehicle.value, plate=regPlate.value.trim();
  if(!name||!phone||!pass||!plate) return alert("أكمل الحقول *");
  if(pass!==pass2) return alert("كلمتا السر غير متطابقتين");
  if(!regPhoto.files[0]||!regIdPhoto.files[0]||!regGrayCard.files[0]) return alert("ارفع الوثائق الثلاث");
  let p1=await toBase64(regPhoto.files[0]), p2=await toBase64(regIdPhoto.files[0]), p3=await toBase64(regGrayCard.files[0]);
  await addDoc(collection(db,"drivers"),{name,phone,password:pass,vehicle,plate,photoBase64:p1,idPhotoBase64:p2,grayCardBase64:p3,status:"pending",createdAt:new Date()});
  alert("✅ تم إرسال طلبك - انتظر الموافقة"); showLogin();
}

function initMap(){
  if(map) return;
  map=L.map('driverMap').setView([18.0735,-15.9582],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

function listenOrders(){
  let q=query(collection(db,"requests"),where("vehicle","==",curDriver.vehicle),where("status","==","new"));
  onSnapshot(q, snap=>{
    let h="";
    if(snap.size>lastOrderCount && lastOrderCount!==0 && soundEnabled){
      document.getElementById('orderSound').play();
      if(Notification.permission==="granted"){ new Notification("🚚 طلب جديد!", {body:`${snap.docs[0]?.data().mouqataa}`}); }
      if(navigator.vibrate) navigator.vibrate([400,100,400]);
    }
    lastOrderCount=snap.size;
    document.getElementById('notifCount').style.display=snap.size>0?'inline':'none';
    document.getElementById('notifCount').textContent=snap.size;
    snap.forEach(s=>{
      let o=s.data();
      let profit=Math.round(o.price*0.90), comm=Math.round(o.price*0.10);
      h+=`<div class="card new-order-anim"><b>${o.mouqataa} → ${o.destArea}</b><br>${o.goodsDesc||''}<br>💰 ${o.price} MRU | <b style="color:#27ae60">ربحك ${profit} (90%)</b> عمولة ${comm}<br><small>${o.name}</small><br><button class="btn btn-green" onclick="acceptOrder('${s.id}')">✅ قبول</button><button class="btn" style="background:#eee;color:#333" onclick="rejectOrder('${s.id}')">❌ رفض</button><button class="btn btn-blue" onclick="showCustOnMap(${o.customerLat},${o.customerLng})">🗺️ موقع الزبون بالضبط</button></div>`;
    });
    orders.innerHTML=h||"<div class='card' style='text-align:center;color:#888'>لا يوجد طلبات</div>";
  });
}

window.showCustOnMap=(lat,lng)=>{
  if(!lat||!lng) return alert("الزبون لم يشارك موقعه GPS");
  document.getElementById('driverMap').style.display='block';
  initMap(); setTimeout(()=>map.invalidateSize(),300);
  if(custMarker) map.removeLayer(custMarker);
  custMarker=L.marker([lat,lng],{icon:L.icon({iconUrl:'https://maps.google.com/mapfiles/ms/icons/red-dot.png',iconSize:[32,32]})}).addTo(map).bindPopup("📍 موقع الزبون بالضبط").openPopup();
  map.setView([lat,lng],16);
}

window.rejectOrder=async(id)=>{ await updateDoc(doc(db,"requests",id),{rejectedBy:curDriver.id}); }

window.acceptOrder=async(id)=>{
  document.getElementById('orderSound').pause();
  let ref=doc(db,"requests",id); let snap=await getDoc(ref); let o=snap.data();
  await updateDoc(ref,{status:"accepted",driverId:curDriver.id,driverName:curDriver.name,driverPhone:curDriver.phone,progress:50,acceptedAt:new Date()});
  let profit=Math.round(o.price*0.90);
  acceptedOrder.innerHTML=`
  <div style="background:#27ae60;color:#fff;padding:14px;border-radius:12px;text-align:center">✅ تم القبول - ربحك ${profit} MRU</div>
  <div class="card" style="border:2px solid #27ae60">
  <div style="font-size:24px;text-align:center;direction:ltr">${o.phone}</div>
  <p><b>العميل:</b> ${o.name}</p><p><b>من:</b> ${o.mouqataa} <b>إلى:</b> ${o.destArea}</p>
  <a href="tel:${o.phone}"><button class="btn btn-blue">📞 اتصال</button></a>
  <a href="https://wa.me/${o.phone.replace(/[^0-9]/g,'')}" target="_blank"><button class="btn btn-whats">💬 واتساب</button></a>
  <button class="btn btn-blue" onclick="showCustOnMap(${o.customerLat},${o.customerLng})">🗺️ موقع الزبون بالضبط على الخريطة</button>
  <button class="btn btn-orange" onclick="updateProgress('${id}','on_the_way')">🚚 أنا في الطريق</button>
  <button class="btn btn-green" onclick="updateProgress('${id}','completed')">✅ تم التوصيل</button>
  </div>`;
  orders.innerHTML=""; showCustOnMap(o.customerLat,o.customerLng); startTracking(id);
};

window.updateProgress=async(id,st)=>{
  if(st==='completed' && !confirm("تم التوصيل؟")) return;
  await updateDoc(doc(db,"requests",id),{status:st,progress:st==='on_the_way'?75:100, ...(st==='completed'?{completedAt:new Date()}:{})});
  if(st==='completed'){ if(trackingInterval) clearInterval(trackingInterval); acceptedOrder.innerHTML=""; document.getElementById('driverMap').style.display='none'; alert("ممتاز! ربحك 90% تم"); listenOrders(); }
};

function startTracking(orderId){
  if(trackingInterval) clearInterval(trackingInterval);
  trackingInterval=setInterval(()=>{
    navigator.geolocation.getCurrentPosition(async pos=>{
      await updateDoc(doc(db,"requests",orderId),{driverLat:pos.coords.latitude,driverLng:pos.coords.longitude,lastUpdate:new Date()});
      if(driverMarker) map.removeLayer(driverMarker);
      driverMarker=L.marker([pos.coords.latitude,pos.coords.longitude]).addTo(map).bindPopup("موقعك").openPopup();
      // رسم خط بينك وبين الزبون
      let snap=await getDoc(doc(db,"requests",orderId)); let o=snap.data();
      if(o.customerLat){
        if(routeLine) map.removeLayer(routeLine);
        routeLine=L.polyline([[pos.coords.latitude,pos.coords.longitude],[o.customerLat,o.customerLng]],{color:'#0a3d62',dashArray:'8,8'}).addTo(map);
      }
    });
  },5000);
}
</script>
</body>
</html>
