<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>السائق</title>
<style>input,select,button{width:100%;padding:10px;margin:5px 0} .card{border:1px solid #ccc;padding:10px;margin:10px 0;border-radius:8px}</style>
</head><body>
<div id="registerDiv">
<h2>تسجيل سائق جديد</h2>
<input id="dName" placeholder="اسم السائق"><input id="dPhone" placeholder="رقم هاتفه">
<select id="dCarType"><option>تاكسي</option><option>واو</option><option>شاحنة 3 طن</option><option>شاحنة 10 طن</option></select>
<input id="dPlate" placeholder="رقم اللوحة"><input id="dPhoto" type="file"><input id="dId" type="file">
<button id="regBtn">إرسال للتسجيل</button>
<p>ملاحظة: لا يمكن اعتمادك حتى يوافق المسؤول</p>
</div>

<div id="ordersDiv" style="display:none"><h2>الطلبات المتاحة</h2><div id="list"></div></div>

<script type="module">
import { db } from './firebase.js';
import { collection, addDoc, query, where, onSnapshot, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

regBtn.onclick = async ()=>{
  await addDoc(collection(db,"drivers"),{
    dName:dName.value, dPhone:dPhone.value, dCarType:dCarType.value, dPlate:dPlate.value,
    status:"pending", createdAt:serverTimestamp()
  });
  alert("تم إرسال طلبك للمسؤول");
};

// استمع للسائق المعتمد
const driverPhone = localStorage.getItem("driverPhone") || prompt("أدخل رقم هاتفك للدخول");
localStorage.setItem("driverPhone", driverPhone);

onSnapshot(query(collection(db,"drivers"), where("dPhone","==",driverPhone), where("status","==","approved")), snap=>{
  if(!snap.empty){ registerDiv.style.display="none"; ordersDiv.style.display="block"; loadOrders(); }
});

function loadOrders(){
  onSnapshot(query(collection(db,"orders"), where("status","==","pending")), s=>{
    list.innerHTML="";
    s.forEach(d=>{
      const o=d.data();
      list.innerHTML+=`<div class="card">
      <b>${o.goodsType}</b> - ${o.goodsDesc}<br>من ${o.fromW} (${o.fromZone}) إلى ${o.toW} (${o.toZone})<br>السيارة المطلوبة: ${o.carType}<br>المبلغ: ${o.price} أوقية
      <button onclick="accept('${d.id}')">قبول الطلب</button></div>`;
    });
  });
}
window.accept = async (id)=>{
  const driverSnap = await (await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")).getDocs(query(collection(db,"drivers"), where("dPhone","==",driverPhone)));
  let driverData = {};
  driverSnap.forEach(x=>driverData=x.data());
  await updateDoc(doc(db,"orders",id),{status:"accepted", driverName:driverData.dName, driverPhone:driverData.dPhone, driverCar:driverData.dCarType, driverPlate:driverData.dPlate});
  alert("قبلت الطلب، الآن يمكنك رؤية رقم الزبون");
  // اعادة تحميل ليرى رقم الهاتف
  onSnapshot(doc(db,"orders",id), ds=>{ const o=ds.data(); list.innerHTML=`<div class="card">تم القبول<br>رقم الزبون: ${o.cPhone}<br>اتصل به الآن</div>`; });
}
</script>
</body></html>
