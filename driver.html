<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - السائق</title>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial} body{background:#f5f7fa;margin:0;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
input,select{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;margin:6px 0}
.btn{width:100%;padding:14px;background:#0a3d62;color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-green{background:#27ae60}
.file-label{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px dashed #0a3d62;padding:12px;border-radius:10px;margin:6px 0;cursor:pointer}
.file-label.ok{border-color:#27ae60;background:#e8f5e9;color:#27ae60}
#imgModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:99;align-items:center;justify-content:center}
#imgModal img{max-width:90%;max-height:90%;border-radius:12px}
</style>
</head>
<body>
<h2 style="text-align:center;color:#0a3d62">🚛 نقلي - السائق</h2>

<div class="card" id="regCard">
<h3>📝 تسجيل سائق جديد</h3>
<input id="dName" placeholder="الاسم الكامل *">
<input id="dPhone" placeholder="رقم الهاتف *">
<select id="dVehicle"><option>تاكسي</option><option>واوا</option><option>شاحنة متوسطة 3 طن</option><option>شاحنة كبيرة 10 طن</option></select>
<input id="dPlate" placeholder="لوحة السيارة *">

<div class="file-label" id="label1" onclick="dPhoto.click()">📸 صورة شخصية * <span id="t1">اختر</span></div>
<input type="file" id="dPhoto" accept="image/*" hidden>

<div class="file-label" id="label2" onclick="dIdPhoto.click()">🪪 بطاقة التعريف * <span id="t2">اختر</span></div>
<input type="file" id="dIdPhoto" accept="image/*" hidden>

<button class="btn" id="regBtn">إرسال للموافقة</button>
<div id="regMsg"></div>
</div>

<div id="imgModal" onclick="this.style.display='none'"><img id="modalImg"></div>

<div class="card" id="loginCard">
<h3>🔑 دخول السائق المعتمد</h3>
<input id="loginPhone" placeholder="رقم هاتفك">
<button class="btn btn-green" id="loginBtn">دخول</button>
</div>
<div id="driverInfo"></div><div id="orders"></div>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, getDocs, query, where, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let url1="", url2="";

dPhoto.onchange=e=>{
 let f=e.target.files[0]; if(!f) return;
 url1=URL.createObjectURL(f);
 label1.classList.add('ok'); t1.textContent="✅ تم - اضغط للتحقق";
}
dIdPhoto.onchange=e=>{
 let f=e.target.files[0]; if(!f) return;
 url2=URL.createObjectURL(f);
 label2.classList.add('ok'); t2.textContent="✅ تم - اضغط للتحقق";
}

// عند الضغط مرة ثانية على نفس الخانة، يفتح الصورة للتحقق
label1.onclick=(ev)=>{
 if(url1 && t1.textContent.includes("تم")){ ev.preventDefault(); modalImg.src=url1; imgModal.style.display='flex'; setTimeout(()=>dPhoto.click(),200); }
}
label2.onclick=(ev)=>{
 if(url2 && t2.textContent.includes("تم")){ ev.preventDefault(); modalImg.src=url2; imgModal.style.display='flex'; setTimeout(()=>dIdPhoto.click(),200); }
}

function compress(file){
 return new Promise(res=>{
  let r=new FileReader(); r.onload=e=>{
   let img=new Image(); img.onload=()=>{
    let c=document.createElement('canvas');
    let w=img.width, h=img.height;
    if(w>600){ h=h*600/w; w=600; }
    c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',0.5));
   }; img.src=e.target.result;
  }; r.readAsDataURL(file);
 });
}

regBtn.onclick=async()=>{
let name=dName.value.trim(), phone=dPhone.value.trim(), vehicle=dVehicle.value, plate=dPlate.value.trim();
if(!name||!phone||!plate||!dPhoto.files[0]||!dIdPhoto.files[0]) return alert("⚠️ أكمل جميع البيانات والصور");
regMsg.textContent="⏳ جاري الحفظ...";
try{
let photoBase64=await compress(dPhoto.files[0]);
let idPhotoBase64=await compress(dIdPhoto.files[0]);
await addDoc(collection(db,"drivers"),{name,phone,vehicle,plate,photoBase64,idPhotoBase64,status:"pending",createdAt:new Date()});
regMsg.innerHTML="<div style='background:#e8f5e9;padding:10px;border-radius:10px;color:green'>✅ تم، انتظر الموافقة</div>";
}catch(e){ regMsg.textContent="خطأ: "+e.message; }
};

loginBtn.onclick=async()=>{
let q=query(collection(db,"drivers"),where("phone","==",loginPhone.value.trim()));
let snap=await getDocs(q);
if(snap.empty) return alert("رقم غير موجود");
let d=snap.docs[0]; let o=d.data();
if(o.status!="approved") return alert("⏳ لم تتم الموافقة بعد");
let cur={id:d.id,...o};
driverInfo.innerHTML=`<div class="card" style="border:2px solid #27ae60"><b>مرحبا ${o.name}</b> ✅</div>`;
};
</script>
</body>
</html>
