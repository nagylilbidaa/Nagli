
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>تحكم Nagli</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-900 text-white p-6">
<h1 class="text-3xl font-bold mb-6">Dashboard - Nagli</h1>
<div class="grid grid-cols-3 gap-4 mb-6">
<div class="bg-white text-black p-4 rounded-xl text-center"><p>جديد</p><b id="c1" class="text-2xl">0</b></div>
<div class="bg-yellow-400 text-black p-4 rounded-xl text-center"><p>قيد التوصيل</p><b id="c2" class="text-2xl">0</b></div>
<div class="bg-green-400 text-black p-4 rounded-xl text-center"><p>مكتمل</p><b id="c3" class="text-2xl">0</b></div>
</div>
<div id="all" class="bg-white text-black rounded-xl p-4"></div>
<script type="module">
import { db } from './firebase.js';
import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
onSnapshot(collection(db,"orders"), (snap)=>{
  let n=0,a=0,d=0; all.innerHTML="";
  snap.forEach(doc=>{ const o=doc.data(); if(o.status=='new')n++; if(o.status=='accepted')a++; if(o.status=='delivered')d++; all.innerHTML+=`<div class="flex justify-between border-b py-2"><span>${o.name} - ${o.phone}</span><span class="text-sm bg-gray-100 px-2 rounded">${o.status}</span></div>`; });
  c1.textContent=n; c2.textContent=a; c3.textContent=d;
});
</script>
</body>
</html>
