<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8"><title>لوحة التحكم</title>
<style>table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px}button{padding:5px 10px}</style>
</head><body>
<h2>طلبات السائقين المعلقة</h2><div id="drivers"></div>
<h2>طلبات الزبائن الحية - ربط بالسائق المعتمد</h2><div id="orders"></div>

<script type="module">
import { db } from './firebase.js';
import { collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// السائقين
onSnapshot(collection(db,"drivers"), snap=>{
  drivers.innerHTML="";
  snap.forEach(d=>{
    const o=d.data(); if(o.status!="pending") return;
    drivers.innerHTML+=`${o.dName} - ${o.dPhone} - ${o.dCarType} - ${o.dPlate} <button onclick="approve('${d.id}')">موافقة</button><button onclick="reject('${d.id}')">رفض</button><hr>`;
  });
});
window.approve=(id)=>updateDoc(doc(db,"drivers",id),{status:"approved"});
window.reject=(id)=>updateDoc(doc(db,"drivers",id),{status:"rejected"});

// الطلبات
onSnapshot(collection(db,"orders"), snap=>{
  orders.innerHTML="<table><tr><th>الزبون</th><th>من</th><th>إلى</th><th>المبلغ</th><th>الحالة</th><th>السائق</th></tr>";
  snap.forEach(d=>{
    const o=d.data();
    orders.innerHTML+=`<tr><td>${o.cName} ${o.cPhone}</td><td>${o.fromW} ${o.fromZone}</td><td>${o.toW} ${o.toZone}</td><td>${o.price}</td><td>${o.status}</td><td>${o.driverName||"لم يربط"} ${o.driverCar||""} ${o.driverPlate||""}</td></tr>`;
  });
  orders.innerHTML+="</table>";
});
</script>
</body></html>
