<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نقلي - لوحة تحكم احترافية</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--main:#0a3d62;--green:#27ae60;--red:#e74c3c;--bg:#f0f4f8}
*{box-sizing:border-box;font-family:Tajawal,system-ui}body{margin:0;background:var(--bg)}
.header{background:var(--main);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:12px}
.stat{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.card{background:#fff;border-radius:12px;padding:14px;margin:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.btn{padding:8px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
.approve{background:var(--green);color:#fff}.reject{background:var(--red);color:#fff}.blue{background:var(--main);color:#fff}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin:6px 0}
#map{height:500px;border-radius:12px}
.badge{padding:4px 8px;border-radius:20px;font-size:12px;color:#fff}
.thumb{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid #ddd;cursor:pointer}
#imgModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
#imgModal img{max-width:95%;max-height:85%;border-radius:12px;border:3px solid #fff}
</style>
</head>
<body>
<div id="loginBox" class="card" style="max-width:380px;margin:90px auto;text-align:center">
<h2>👑 دخول الإدارة</h2>
<input id="email" type="email" placeholder="naglylilbidaa@gmail.com" value="naglylilbidaa@gmail.com">
<input id="pass" type="password" placeholder="كلمة السر">
<button class="btn approve" style="width:100%" onclick="login()">دخول آمن</button>
<p id="err" style="color:red"></p>
</div>

<div id="panel" style="display:none">
<div class="header"><b>🚚 نقلي - لوحة التحكم</b><div><span id="adminEmail"></span> <button class="btn" style="background:#fff;color:var(--main)" onclick="logout()">خروج</button></div></div>

<div class="stats">
<div class="stat"><h2 id="sPending">0</h2><small>معلقون</small></div>
<div class="stat"><h2 id="sApproved">0</h2><small>معتمدون</small></div>
<div class="stat"><h2 id="sReq">0</h2><small>طلبات</small></div>
</div>

<div class="card"><input id="search" placeholder="🔍 ابحث بالاسم أو الهاتف..." oninput="filter()"></div>
<div class="card" style="border-right:5px solid orange"><h3>⏳ معلقون</h3><div id="pending"></div></div>
<div class="card" style="border-right:5px solid var(--green)"><h3>✅ معتمدون</h3><div id="approved"></div></div>
<div class="card"><h3>📦 الطلبات</h3><div id="reqs"></div></div>
<div class="card"><h3>🗺️ الخريطة الحية</h3><div id="map"></div></div>
</div>

<div id="imgModal" onclick="this.style.display='none'"><img id="modalImg"><b id="modalTxt" style="color:#fff;margin-top:8px"></b></div>

<script type="module">
import { db } from "./firebase.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, getDocs, query, where, updateDoc, doc, deleteDoc, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const ALLOWED_ADMINS = ["naglylilbidaa@gmail.com"];
const auth = getAuth();
let map;

onAuthStateChanged(auth, user=>{
 if(user && ALLOWED_ADMINS.includes(user.email)){
   document.getElementById('panel').style.display='block';
   document.getElementById('loginBox').style.display='none';
   document.getElementById('adminEmail').innerText=user.email;
   init(); resetTimer();
 } else if(user){
   alert("هذا الحساب ليس مسؤولا"); signOut(auth);
 } else {
   document.getElementById('panel').style.display='none';
   document.getElementById('loginBox').style.display='block';
 }
});

window.login = async()=>{
 try{ await signInWithEmailAndPassword(auth, email.value.trim(), pass.value); }
 catch(e){ err.innerText="خطأ: "+e.code; }
};
window.logout = ()=> signOut(auth).then(()=>location.reload());

function init(){
 map=L.map('map').setView([18.0735,-15.9582],11);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
 onSnapshot(collection(db,"drivers"), ()=>loadAll());
 onSnapshot(collection(db,"requests"), ()=>loadAll());
 loadAll();
}

async function loadAll(){
 let pSnap=await getDocs(query(collection(db,"drivers"),where("status","==","pending")));
 let aSnap=await getDocs(query(collection(db,"drivers"),where("status","==","approved")));
 let rSnap=await getDocs(collection(db,"requests"));
 sPending.innerText=pSnap.size; sApproved.innerText=aSnap.size; sReq.innerText=rSnap.size;
 let h=""; 
 pSnap.forEach(d=>{
  let o=d.data();
  h+=`<div class="card driver-item"><b>${o.name}</b> - ${o.phone} - ${o.vehicle} - لوحة: ${o.plate||''} <span class="badge" style="background:orange">معلق</span>
  <div style="display:flex;gap:8px;margin:8px 0">
   <img class="thumb" src="${o.photoBase64||''}" onclick="openImg('${o.photoBase64}','صورة السائق - ${o.name}')" title="اضغط للتحقق">
   <img class="thumb" src="${o.idPhotoBase64||''}" onclick="openImg('${o.idPhotoBase64}','بطاقة التعريف - ${o.name}')" title="اضغط للتحقق">
  </div>
  <button class="btn approve" onclick="approve('${d.id}','${o.name}')">اعتماد</button> <button class="btn reject" onclick="reject('${d.id}','${o.name}')">رفض</button></div>`;
 });
 pending.innerHTML=h||"لا يوجد";
 let h2=""; 
 aSnap.forEach(d=>{
  let o=d.data();
  h2+=`<div class="card driver-item">✅ <b>${o.name}</b> - ${o.phone} - ${o.vehicle}
  <div style="display:flex;gap:8px;margin:8px 0">
   <img class="thumb" src="${o.photoBase64||''}" onclick="openImg('${o.photoBase64}','صورة السائق - ${o.name}')">
   <img class="thumb" src="${o.idPhotoBase64||''}" onclick="openImg('${o.idPhotoBase64}','بطاقة التعريف - ${o.name}')">
  </div>
  <button class="btn reject" style="background:#e67e22" onclick="cancelApprove('${d.id}','${o.name}')">⚠️ إلغاء الاعتماد</button>
  </div>`;
 });
 approved.innerHTML=h2;
 let h3=""; rSnap.forEach(d=>{let o=d.data(); h3+=`<div class="card">📦 ${o.name} | ${o.mouqataa}→${o.destArea}</div>`});
 reqs.innerHTML=h3;
}

window.approve=async(id,name)=>{
 await updateDoc(doc(db,"drivers",id),{status:"approved", approvedAt:serverTimestamp(), approvedBy:auth.currentUser.email});
 await addDoc(collection(db,"logs"),{action:"approve", driverId:id, driverName:name, by:auth.currentUser.email, at:serverTimestamp()});
 alert("تم الاعتماد");
};
window.reject=async(id,name)=>{
 if(!confirm("تأكيد الرفض؟")) return;
 await deleteDoc(doc(db,"drivers",id));
 await addDoc(collection(db,"logs"),{action:"reject", driverId:id, driverName:name, by:auth.currentUser.email, at:serverTimestamp()});
};
window.cancelApprove=async(id,name)=>{
 if(!confirm("هل تريد إلغاء اعتماد "+name+" ؟ سيعود إلى قائمة المعلقين")) return;
 await updateDoc(doc(db,"drivers",id),{status:"pending", approvedAt:serverTimestamp(), approvedBy:auth.currentUser.email});
 await addDoc(collection(db,"logs"),{action:"cancel_approve", driverId:id, driverName:name, by:auth.currentUser.email, at:serverTimestamp()});
 alert("تم إلغاء الاعتماد");
};

window.openImg=(src,txt)=>{
 if(!src) return;
 modalImg.src=src;
 modalTxt.innerText=txt;
 imgModal.style.display='flex';
};

let timer; function resetTimer(){ clearTimeout(timer); timer=setTimeout(()=>{alert("انتهت الجلسة"); logout();}, 15*60*1000); }
['click','mousemove','keypress'].forEach(e=>document.addEventListener(e,resetTimer));
window.filter=()=>{let q=search.value.toLowerCase(); document.querySelectorAll('.driver-item').forEach(el=>{el.style.display=el.innerText.toLowerCase().includes(q)?'block':'none'})};
</script>
</body>
</html>
