
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - الإدارة 10%</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{background:#f0f2f5;margin:0;padding:12px}
.header{background:#0a1931;color:#fff;padding:18px;text-align:center;border-radius:0 0 18px 18px;margin:-12px -12px 15px -12px}
.card{background:#fff;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat-card{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.stat-num{font-size:22px;font-weight:bold;color:#27ae60}
.btn{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin:4px}
.btn-green{background:#27ae60;color:#fff}.btn-red{background:#e74c3c;color:#fff}.btn-blue{background:#1a73e8;color:#fff}
#adminMap{height:400px;border-radius:12px;border:2px solid #0a1931}
.badge{padding:3px 8px;border-radius:6px;font-size:12px;color:#fff}
.b-new{background:#3498db}.b-accepted{background:#f39c12}.b-way{background:#9b59b6}.b-done{background:#27ae60}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;padding:12px;background:#eee;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.tab.active{background:#0a1931;color:#fff}
</style>
</head>
<body>
<div class="header"><h2 style="margin:0">👑 إدارة نقلي - عمولة 10%</h2></div>

<div class="stats">
<div class="stat-card"><div>طلبات اليوم</div><div class="stat-num" id="todayOrders">0</div></div>
<div class="stat-card"><div>أرباحك اليوم (10%)</div><div class="stat-num" id="todayProfit">0 MRU</div></div>
<div class="stat-card"><div>مكتملة</div><div class="stat-num" id="doneOrders">0</div></div>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('orders',this)">📦 الطلبات</button>
<button class="tab" onclick="showTab('drivers',this)">🚕 السائقين</button>
<button class="tab" onclick="showTab('map',this)">🗺️ الخريطة</button>
</div>

<div id="ordersTab"></div>
<div id="driversTab" style="display:none"></div>
<div id="mapTab" style="display:none"><div class="card"><div id="adminMap"></div></div></div>

<script type="module">
import { db } from "./firebase.js";
import { collection, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
let adminMap, markers=[];
window.showTab=(t,el)=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('ordersTab').style.display=t==='orders'?'block':'none';
  document.getElementById('driversTab').style.display=t==='drivers'?'block':'none';
  document.getElementById('mapTab').style.display=t==='map'?'block':'none';
  if(el) el.classList.add('active');
  if(t==='map') setTimeout(()=>{adminMap.invalidateSize();},300);
}
function initAdminMap(){ adminMap=L.map('adminMap').setView([18.0735,-15.9582],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(adminMap); }
async function loadOrders(){
  onSnapshot(query(collection(db,"requests"), orderBy("createdAt","desc")), snap=>{
    let h="", today=0, profit=0, done=0; let todayStr=new Date().toDateString();
    snap.forEach(s=>{
      let o=s.data(); let d=o.createdAt?.toDate ? o.createdAt.toDate() : new Date(o.createdAt);
      let commission=(o.price*0.10).toFixed(1); let driverProfit=(o.price*0.90).toFixed(1);
      if(d.toDateString()===todayStr){ today++; profit+=parseFloat(commission); }
      if(o.status==='completed') done++;
      let badge=o.status==='new'?'b-new':o.status==='accepted'?'b-accepted':o.status==='on_the_way'?'b-way':'b-done';
      h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${o.mouqataa} → ${o.destArea}</b><span class="badge ${badge}">${o.status}</span></div><small>${o.name} - ${o.vehicle} - ${o.price} MRU</small><br>💰 عمولتك (10%): <b style="color:#27ae60">${commission} MRU</b> | للسائق: ${driverProfit} MRU<br><small>${d.toLocaleString('ar-MR')}</small></div>`;
    });
    document.getElementById('ordersTab').innerHTML=h||"<div class='card'>لا يوجد طلبات</div>";
    document.getElementById('todayOrders').textContent=today;
    document.getElementById('todayProfit').textContent=profit.toFixed(1)+" MRU";
    document.getElementById('doneOrders').textContent=done;
  });
}
async function loadDrivers(){
  onSnapshot(collection(db,"drivers"), snap=>{
    let h=""; snap.forEach(d=>{let o=d.data(); h+=`<div class="card" style="display:flex;gap:10px"><img src="${o.photoBase64||''}" style="width:60px;height:60px;border-radius:50%;object-fit:cover"><div style="flex:1"><b>${o.name}</b> - ${o.vehicle}<br>${o.phone}<br><span class="badge ${o.status==='approved'?'b-done':'b-new'}">${o.status}</span></div><div>${o.status!=='approved'?`<button class="btn btn-green" onclick="approve('${d.id}')">✅ موافقة</button>`:''}</div></div>`;});
    document.getElementById('driversTab').innerHTML=h;
  });
}
window.approve=async(id)=>{ await updateDoc(doc(db,"drivers",id),{status:"approved"}); }
window.addEventListener('load',()=>{ initAdminMap(); loadOrders(); loadDrivers(); });
</script>
</body>
</html>
