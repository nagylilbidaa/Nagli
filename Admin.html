
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - إدارة متكاملة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{background:#f0f2f5;margin:0;padding:12px}
.header{background:#0a1931;color:#fff;padding:18px;text-align:center;border-radius:0 0 18px 18px;margin:-12px -12px 15px}
.card{background:#fff;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.stat-num{font-size:22px;font-weight:bold;color:#27ae60}
.btn{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px;display:inline-flex;align-items:center;gap:6px}
.btn-green{background:#27ae60;color:#fff}.btn-red{background:#e74c3c;color:#fff}.btn-blue{background:#1a73e8;color:#fff}.btn-orange{background:#ff9800;color:#fff}.btn-whats{background:#25D366;color:#fff}.btn-call{background:#0a1931;color:#fff}
#adminMap{height:350px;border-radius:12px;border:2px solid #0a1931}
#trackMap{height:450px;border-radius:12px;border:2px solid #0a1931;margin-top:10px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;padding:12px;background:#eee;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.tab.active{background:#0a1931;color:#fff}
input,textarea{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin:6px 0}
textarea{height:80px;resize:none}
.hidden{display:none}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-box{background:#f8f9fa;padding:12px;border-radius:10px;border-right:4px solid #0a1931}
.badge{padding:4px 10px;border-radius:20px;color:#fff;font-size:12px}
.b-new{background:#3498db}.b-accepted{background:#f39c12}.b-way{background:#9b59b6}.b-done{background:#27ae60}
</style>
</head>
<body>
<div class="header"><h2 style="margin:0">👑 إدارة نقلي - تحكم كامل</h2></div>

<div id="loginCard" class="card" style="max-width:400px;margin:30px auto">
<h3 style="text-align:center">🔑 دخول الإدارة</h3>
<input id="adminEmail" type="email" placeholder="البريد الإلكتروني">
<input id="adminPass" type="password" placeholder="كلمة السر">
<button class="btn btn-blue" style="width:100%;justify-content:center" onclick="adminLogin()">دخول</button>
<small id="loginError" style="color:red;text-align:center;display:block"></small>
</div>

<div id="mainContent" class="hidden">
<div id="ordersTab"></div>
<div id="tripDetails" class="card hidden"></div>
<div id="liveSection" class="hidden">
<div class="card"><div id="trackMap"></div></div>
<div class="card">
<h3>💬 إرسال رسالة للرحلة</h3>
<textarea id="msgText" placeholder="اكتب رسالتك للسائق والزبون..."></textarea>
<button class="btn btn-blue" onclick="sendTripMessage()">📤 إرسال رسالة</button>
<button class="btn" style="background:#eee" onclick="stopLive()">⏹️ إيقاف التتبع</button>
</div>
</div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, doc, updateDoc, onSnapshot, query, orderBy, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

let trackMap, driverMarker, custMarker, routeLine, liveUnsub=null, currentTripId=null;
const auth=getAuth();

window.adminLogin=async()=>{
  try{ await signInWithEmailAndPassword(auth, adminEmail.value.trim(), adminPass.value.trim());
    loginCard.classList.add('hidden'); mainContent.classList.remove('hidden'); loadOrders();
  }catch(e){ loginError.innerText=e.message; }
}
window.logout=async()=>{ await signOut(auth); location.reload(); }

function loadOrders(){
  onSnapshot(query(collection(db,"requests"), orderBy("createdAt","desc")), snap=>{
    let h=""; snap.forEach(s=>{
      let o=s.data();
      let st=o.status==="new"?"b-new":o.status==="accepted"?"b-accepted":o.status==="onway"?"b-way":"b-done";
      h+=`<div class="card" onclick="openTrip('${s.id}')" style="cursor:pointer">
        <span class="badge ${st}">${o.status||'new'}</span>
        <b>${o.mouqataa||''} → ${o.destArea||''}</b><br>
        👤 ${o.name||'زبون'} | 💰 ${o.price||0} MRU | عمولتك: ${(o.price*0.1).toFixed(0)}
      </div>`;
    });
    ordersTab.innerHTML=h||"لا يوجد طلبات";
  });
}

window.openTrip=async(id)=>{
  currentTripId=id;
  let snap=await getDoc(doc(db,"requests",id)); let o=snap.data();
  let driver = o.driverId ? (await getDoc(doc(db,"drivers",o.driverId))).data() : null;
  
  tripDetails.classList.remove('hidden');
  tripDetails.innerHTML=`
  <h2 style="margin:0 0 10px">📦 تفاصيل الرحلة #${id.slice(0,6)}</h2>
  <span class="badge ${o.status==='new'?'b-new':o.status==='accepted'?'b-accepted':o.status==='onway'?'b-way':'b-done'}">${o.status}</span>
  
  <div class="info-grid" style="margin-top:12px">
    <div class="info-box">
      <b>👤 الزبون</b><br>
      الاسم: ${o.name||'-'}<br>
      الهاتف: ${o.phone||'-'}<br>
      من: ${o.mouqataa||'-'}<br>
      إلى: ${o.destArea||o.destination||'-'}<br>
      السعر: ${o.price} MRU<br>
      <button class="btn btn-call" onclick="callNum('${o.phone}')">📞 اتصال</button>
      <button class="btn btn-whats" onclick="whats('${o.phone}')">💬 واتساب</button>
    </div>
    <div class="info-box" style="border-right-color:#27ae60">
      <b>🚕 السائق</b><br>
      ${driver?`
        الاسم: ${driver.name}<br>
        الهاتف: ${driver.phone}<br>
        السيارة: ${driver.carType||'-'} - ${driver.plate||''}<br>
        الحالة: ${driver.status}<br>
        <button class="btn btn-call" onclick="callNum('${driver.phone}')">📞 اتصال</button>
        <button class="btn btn-whats" onclick="whats('${driver.phone}')">💬 واتساب</button>
      `:'لم يتم قبول الرحلة بعد'}
    </div>
  </div>

  <div style="margin-top:12px">
    <button class="btn btn-orange" onclick="showLive('${id}')">🗺️ تتبع حي + مسار</button>
    <button class="btn btn-green" onclick="completeTrip('${id}')">✅ إنهاء الرحلة</button>
    <button class="btn btn-red" onclick="cancelTrip('${id}')">❌ إلغاء</button>
  </div>
  `;
  showLive(id);
}

window.showLive=async(id)=>{
  currentTripId=id;
  let snap=await getDoc(doc(db,"requests",id)); let o=snap.data();
  liveSection.classList.remove('hidden');
  document.getElementById('trackMap').innerHTML="";
  if(trackMap){ trackMap.remove(); trackMap=null; }
  
  trackMap=L.map('trackMap').setView([o.customerLat||18.0735, o.customerLng||-15.9582],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(trackMap);
  setTimeout(()=>trackMap.invalidateSize(),300);

  if(o.customerLat) custMarker=L.marker([o.customerLat,o.customerLng],{icon:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/149/149060.png',iconSize:[32,32]})}).addTo(trackMap).bindPopup("الزبون");
  
  if(liveUnsub) liveUnsub();
  liveUnsub=onSnapshot(doc(db,"requests",id), s=>{
    let d=s.data();
    if(!d.driverLat) return;
    if(driverMarker) trackMap.removeLayer(driverMarker);
    driverMarker=L.marker([d.driverLat,d.driverLng],{icon:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/3448/3448609.png',iconSize:[38,38]})}).addTo(trackMap).bindPopup(`السائق: ${d.driverName||''}<br>السرعة: ${d.speed||0} كم/س`);
    
    if(d.customerLat && d.driverLat){
      if(routeLine) trackMap.removeLayer(routeLine);
      routeLine=L.polyline([[d.customerLat,d.customerLng],[d.driverLat,d.driverLng]],{color:'#0a1931',dashArray:'8,8',weight:4}).addTo(trackMap);
      let dist=trackMap.distance([d.customerLat,d.customerLng],[d.driverLat,d.driverLng]);
      driverMarker.bindPopup(`المسافة للزبون: ${(dist/1000).toFixed(2)} كم`).openPopup();
    }
  });
}

window.callNum=(num)=>{ window.open(`tel:${num}`); }
window.whats=(num)=>{ 
  let clean=num.replace(/[^0-9]/g,''); 
  if(clean.startsWith('0')) clean='222'+clean.substring(1);
  window.open(`https://wa.me/${clean}`,'_blank'); 
}

window.sendTripMessage=async()=>{
  let txt=document.getElementById('msgText').value.trim();
  if(!txt||!currentTripId) return alert("اكتب رسالة");
  await addDoc(collection(db,"requests",currentTripId,"messages"),{
    text: txt, from: "admin", createdAt: serverTimestamp()
  });
  await updateDoc(doc(db,"requests",currentTripId),{ lastAdminMessage: txt, lastMessageAt: serverTimestamp() });
  alert("تم إرسال الرسالة للسائق والزبون ✅");
  document.getElementById('msgText').value="";
}

window.completeTrip=async(id)=>{ if(confirm("إنهاء الرحلة؟")) await updateDoc(doc(db,"requests",id),{status:"completed"}); }
window.cancelTrip=async(id)=>{ if(confirm("إلغاء الرحلة؟")) await updateDoc(doc(db,"requests",id),{status:"cancelled"}); }
window.stopLive=()=>{ if(liveUnsub) liveUnsub(); liveSection.classList.add('hidden'); }
</script>
</body>
</html>
