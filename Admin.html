
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نقلي - لوحة تحكم احترافية</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--main:#0a3d62;--green:#27ae60;--red:#e74c3c;--bg:#f0f4f8}
*{box-sizing:border-box;font-family:Tajawal,system-ui}body{margin:0;background:var(--bg)}
.header{background:var(--main);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:12px}
.stat{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.card{background:#fff;border-radius:12px;padding:14px;margin:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.btn{padding:8px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold;margin:2px}
.approve{background:var(--green);color:#fff}.reject{background:var(--red);color:#fff}.blue{background:var(--main);color:#fff}
.btn-call{background:#27ae60;color:#fff}.btn-wa{background:#25D366;color:#fff}.btn-msg{background:#2980b9;color:#fff}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;margin:6px 0}
#map{height:500px;border-radius:12px}
.badge{padding:4px 8px;border-radius:20px;font-size:12px;color:#fff}
.thumb{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid #ddd;cursor:pointer}
#imgModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
#imgModal img{max-width:95%;max-height:85%;border-radius:12px;border:3px solid #fff}
.driver-box{border:2px solid var(--green);background:#f0fff4}
</style>
</head>
<body>
<div id="loginBox" class="card" style="max-width:380px;margin:90px auto;text-align:center">
<h2>👑 دخول الإدارة</h2>
<input id="email" type="email" placeholder="naglylilbidaa@gmail.com" value="naglylilbidaa@gmail.com">
<input id="pass" type="password" placeholder="كلمة السر - مطلوبة كل مرة">
<button class="btn approve" style="width:100%" onclick="login()">دخول آمن</button>
<p id="err" style="color:red"></p>
</div>

<div id="panel" style="display:none">
<div class="header"><b>🚚 نقلي - لوحة التحكم</b><div><span id="adminEmail"></span> <button class="btn" style="background:#fff;color:var(--main)" onclick="logout()">خروج</button></div></div>

<div class="stats">
<div class="stat"><h2 id="sPending">0</h2><small>معلقون</small></div>
<div class="stat"><h2 id="sApproved">0</h2><small>معتمدون</small></div>
<div class="stat"><h2 id="sReq">0</h2><small>طلبات</small></div>
</div>

<div class="card"><input id="search" placeholder="🔍 ابحث بالاسم أو الهاتف..." oninput="filter()"></div>
<div class="card" style="border-right:5px solid orange"><h3>⏳ معلقون</h3><div id="pending"></div></div>
<div class="card" style="border-right:5px solid var(--green)"><h3>✅ معتمدون</h3><div id="approved"></div></div>
<div class="card"><h3>📦 الطلبات - معلومات كاملة + تتبع</h3><div id="reqs"></div></div>
<div class="card"><h3>🗺️ الخريطة الحية - تتبع الرحلة حتى النهاية</h3><div id="map"></div><p id="trackInfo" style="font-size:13px;color:#555"></p></div>
</div>

<div id="imgModal" onclick="this.style.display='none'"><img id="modalImg"><b id="modalTxt" style="color:#fff;margin-top:8px"></b></div>

<script type="module">
import { db } from "./firebase.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, getDocs, query, where, updateDoc, doc, deleteDoc, addDoc, serverTimestamp, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const ALLOWED_ADMINS = ["naglylilbidaa@gmail.com"];
const auth = getAuth();
let map, driverMarker, customerMarker, activeTrackUnsub = null;

// --- 1. كلمة السر كل مرة: اجبار الجلسة المؤقتة + تسجيل خروج عند البدء ---
setPersistence(auth, browserSessionPersistence);
signOut(auth); // يطلب كلمة السر كل مرة تفتح الصفحة

onAuthStateChanged(auth, user=>{
 if(user && ALLOWED_ADMINS.includes(user.email)){
   document.getElementById('panel').style.display='block';
   document.getElementById('loginBox').style.display='none';
   document.getElementById('adminEmail').innerText=user.email;
   init(); resetTimer();
 } else if(user){
   alert("هذا الحساب ليس مسؤولا"); signOut(auth);
 } else {
   document.getElementById('panel').style.display='none';
   document.getElementById('loginBox').style.display='block';
 }
});

window.login = async()=>{
 try{ 
   await setPersistence(auth, browserSessionPersistence);
   await signInWithEmailAndPassword(auth, email.value.trim(), pass.value); 
 }
 catch(e){ err.innerText="خطأ: "+e.code; }
};
window.logout = ()=> signOut(auth).then(()=>location.reload());

function init(){
 map=L.map('map').setView([18.0735,-15.9582],11);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
 onSnapshot(collection(db,"drivers"), ()=>loadAll());
 onSnapshot(collection(db,"requests"), ()=>loadAll());
 loadAll();
}

async function loadAll(){
 let pSnap=await getDocs(query(collection(db,"drivers"),where("status","==","pending")));
 let aSnap=await getDocs(query(collection(db,"drivers"),where("status","==","approved")));
 let rSnap=await getDocs(collection(db,"requests"));
 sPending.innerText=pSnap.size; sApproved.innerText=aSnap.size; sReq.innerText=rSnap.size;
 
 let h=""; 
 pSnap.forEach(d=>{
  let o=d.data();
  h+=`<div class="card driver-item"><b>${o.name}</b> - ${o.phone} - ${o.vehicle} - لوحة: ${o.plate||''} <span class="badge" style="background:orange">معلق</span>
  <div style="display:flex;gap:8px;margin:8px 0">
   <img class="thumb" src="${o.photoBase64||''}" onclick="openImg('${o.photoBase64}','صورة السائق - ${o.name}')">
   <img class="thumb" src="${o.idPhotoBase64||''}" onclick="openImg('${o.idPhotoBase64}','بطاقة التعريف - ${o.name}')">
  </div>
  <button class="btn approve" onclick="approve('${d.id}','${o.name}')">اعتماد</button> <button class="btn reject" onclick="reject('${d.id}','${o.name}')">رفض</button></div>`;
 });
 pending.innerHTML=h||"لا يوجد";
 
 let h2=""; 
 aSnap.forEach(d=>{
  let o=d.data();
  h2+=`<div class="card driver-item">✅ <b>${o.name}</b> - ${o.phone} - ${o.vehicle}
  <div style="display:flex;gap:8px;margin:8px 0">
   <img class="thumb" src="${o.photoBase64||''}" onclick="openImg('${o.photoBase64}','صورة السائق - ${o.name}')">
   <img class="thumb" src="${o.idPhotoBase64||''}" onclick="openImg('${o.idPhotoBase64}','بطاقة التعريف - ${o.name}')">
  </div>
  <button class="btn reject" style="background:#e67e22" onclick="cancelApprove('${d.id}','${o.name}')">⚠️ إلغاء الاعتماد</button></div>`;
 });
 approved.innerHTML=h2;

 // --- 2. الطلبات بمعلومات كاملة ---
 let h3="";
 for (let d of rSnap.docs){
   let o=d.data();
   let id=d.id;
   let driverDetails = "";
   if(o.driverId || o.acceptedBy){
     let driverId = o.driverId || o.acceptedBy;
     try{
       let drSnap = await getDoc(doc(db,"drivers",driverId));
       if(drSnap.exists()){
         let dr = drSnap.data();
         driverDetails = `
           <div class="card driver-box">
             <h4>🚕 معلومات السائق الذي وافق:</h4>
             <div style="display:flex;gap:10px;align-items:center">
               <img src="${dr.photoBase64||''}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #27ae60">
               <div>
                 <p style="margin:2px"><b>الاسم:</b> ${dr.name}</p>
                 <p style="margin:2px"><b>الهاتف:</b> ${dr.phone}</p>
                 <p style="margin:2px"><b>نوع السيارة:</b> ${dr.vehicle||dr.carType||''}</p>
                 <p style="margin:2px"><b>اللوحة:</b> ${dr.plate||dr.carPlate||''}</p>
               </div>
             </div>
             <div style="margin-top:8px">
               <a href="tel:${dr.phone}"><button class="btn btn-call">📞 اتصال بالسائق</button></a>
               <a href="https://wa.me/${dr.phone}" target="_blank"><button class="btn btn-wa">💬 واتساب سائق</button></a>
               <button class="btn btn-msg" onclick="sendMsg('${id}','${dr.phone}','driver')">✉️ رسالة للسائق</button>
               <button class="btn blue" onclick="trackOrder('${id}')">🗺️ تتبع الرحلة</button>
             </div>
           </div>
         `;
       }
     }catch(e){}
   }

   h3+=`<div class="card driver-item" style="border-right:5px solid ${o.status=='completed'?'green': o.driverId?'#2980b9':'#ccc'}">
     <b>طلب #${id.slice(0,6)}</b> - <span class="badge" style="background:${o.status=='completed'?'green':'#0a3d62'}">${o.status||'جديد'}</span><br>
     <b>الزبون:</b> ${o.name||o.customerName||''} - ${o.phone||o.customerPhone||''}<br>
     <b>المسار:</b> ${o.mouqataa||o.from||''} → ${o.destArea||o.to||''}<br>
     <b>التفاصيل:</b> ${o.details||''}<br>
     <b>السعر:</b> ${o.price||'غير محدد'}<br>
     <div style="margin-top:8px">
       <a href="tel:${o.phone||o.customerPhone}"><button class="btn btn-call">📞 اتصال بالزبون</button></a>
       <a href="https://wa.me/${o.phone||o.customerPhone}" target="_blank"><button class="btn btn-wa">💬 واتساب زبون</button></a>
       <button class="btn btn-msg" onclick="sendMsg('${id}','${o.phone||o.customerPhone}','customer')">✉️ رسالة للزبون</button>
     </div>
     ${driverDetails}
   </div>`;
 }
 reqs.innerHTML=h3||"لا يوجد طلبات";
}

window.approve=async(id,name)=>{
 await updateDoc(doc(db,"drivers",id),{status:"approved", approvedAt:serverTimestamp(), approvedBy:auth.currentUser.email});
 await addDoc(collection(db,"logs"),{action:"approve", driverId:id, driverName:name, by:auth.currentUser.email, at:serverTimestamp()});
};
window.reject=async(id,name)=>{
 if(!confirm("تأكيد الرفض؟")) return;
 await deleteDoc(doc(db,"drivers",id));
 await addDoc(collection(db,"logs"),{action:"reject", driverId:id, driverName:name, by:auth.currentUser.email, at:serverTimestamp()});
};
window.cancelApprove=async(id,name)=>{
 if(!confirm("هل تريد إلغاء اعتماد "+name+" ؟")) return;
 await updateDoc(doc(db,"drivers",id),{status:"pending"});
};

window.openImg=(src,txt)=>{
 if(!src) return;
 modalImg.src=src;
 modalTxt.innerText=txt;
 imgModal.style.display='flex';
};

window.sendMsg=async(orderId, phone, type)=>{
  let txt = prompt(`رسالتك إلى ${type==='driver'?'السائق':'الزبون'} (${phone}):`);
  if(!txt) return;
  await addDoc(collection(db,"adminMessages"),{orderId, phone, type, text:txt, by:auth.currentUser.email, at:serverTimestamp()});
  await addDoc(collection(db,"requests",orderId,"messages"),{text:txt, from:'admin', to:type, at:serverTimestamp()});
  alert("تم إرسال الرسالة ✅");
};

window.trackOrder=async(orderId)=>{
  if(activeTrackUnsub) activeTrackUnsub();
  trackInfo.innerText = "جاري تتبع الطلب "+orderId+" ...";
  let unsub = onSnapshot(doc(db,"requests",orderId), (snap)=>{
    if(!snap.exists()) return;
    let o = snap.data();
    if(o.driverLat && o.driverLng){
      if(driverMarker) map.removeLayer(driverMarker);
      driverMarker = L.marker([o.driverLat, o.driverLng]).addTo(map).bindPopup("السائق - "+orderId).openPopup();
      map.setView([o.driverLat, o.driverLng], 15);
      trackInfo.innerText = `آخر تحديث: ${new Date().toLocaleTimeString()} - الحالة: ${o.status} - السائق: ${o.driverLat}, ${o.driverLng}`;
      if(o.status === 'completed'){
        trackInfo.innerText += " - ✅ انتهت الرحلة";
        unsub();
      }
    }
    if(o.customerLat && o.customerLng){
      if(customerMarker) map.removeLayer(customerMarker);
      customerMarker = L.marker([o.customerLat, o.customerLng], {icon: L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/149/149071.png', iconSize:[32,32]})}).addTo(map);
    }
  });
  activeTrackUnsub = unsub;
};

let timer; function resetTimer(){ clearTimeout(timer); timer=setTimeout(()=>{alert("انتهت الجلسة - سيطلب كلمة السر مرة أخرى"); logout();}, 10*60*1000); }
['click','mousemove','keypress'].forEach(e=>document.addEventListener(e,resetTimer));
window.filter=()=>{let q=search.value.toLowerCase(); document.querySelectorAll('.driver-item').forEach(el=>{el.style.display=el.innerText.toLowerCase().includes(q)?'block':'none'})};
</script>
</body>
</html>
