<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - لوحة المسؤول الآمنة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{margin:0;padding:12px;background:#eef2f7}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,.07)}
#map{height:450px;border-radius:12px;border:2px solid #0a3d62}
.bar{height:14px;background:#eee;border-radius:20px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);transition:0.5s}
.btn{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;margin:3px;font-weight:bold}
.approve{background:#27ae60;color:#fff}
.reject{background:#e74c3c;color:#fff}
.blue{background:#0a3d62;color:#fff}
.preview-img{width:100%;height:160px;object-fit:cover;border-radius:10px;border:2px solid #ddd;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<h2 style="color:#0a3d62">👑 نقلي - لوحة المشرف الآمنة</h2>

<div class="card" id="loginBox">
<input type="email" id="email" placeholder="ايميل المسؤول" value="admin@nagli.mr">
<input type="password" id="pass" placeholder="كلمة السر الجديدة">
<button class="btn approve" onclick="login()">دخول آمن</button>
</div>
<div id="panel" style="display:none">
<div class="card" style="border:2px solid #f39c12"><h3>⏳ سائقون معلقون - يحتاجون تحقق</h3><div id="pending"></div></div>
<div class="card"><h3>✅ سائقون معتمدون ومحفوظون بأمان</h3><div id="approved"></div></div>
<div class="card"><h3>📦 طلبات الزبائن الحية</h3><div id="reqs"></div></div>
<div class="card"><h3>🗺️ تتبع الرحلات</h3><div id="map"></div></div>
</div>

<!-- نافذة التحقق -->
<div class="modal" id="verifyModal">
<div class="modal-box">
<h3 style="color:#0a3d62">🔍 تحقق من بيانات السائق</h3>
<div id="verifyContent"></div>
<button class="btn" style="background:#666;color:#fff;width:100%;margin-top:10px" onclick="closeModal()">إغلاق</button>
</div>
</div>
<script type="module">
import { db } from "./firebase.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, getDocs, query, where, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const auth = getAuth();
let map, driversCache={};

// يتحقق تلقائيا هل أنت مسجل دخول
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('panel').style.display="block";
    document.getElementById('loginBox').style.display="none";
    initMap();
    loadAll();
  } else {
    document.getElementById('panel').style.display="none";
    document.getElementById('loginBox').style.display="block";
  }
});

window.login = async function(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    alert("كلمة السر خطأ: " + e.message);
  }
};

window.logout = async function(){
  await signOut(auth);
  location.reload();
};

function initMap(){
  map=L.map('map').setView([18.0735,-15.9582],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

async function loadAll(){
  // نفس كودك القديم كامل - لا تغيره
  let pSnap=await getDocs(query(collection(db,"drivers"),where("status","==","pending")));
  let h1="";
  pSnap.forEach(d=>{
    let o=d.data(); driversCache[d.id]=o;
    h1+=`<div class="card" style="border:1px solid #f39c12">
    <b>👤 ${o.name}</b> - 📞 ${o.phone} - 🚛 ${o.vehicle}<br>
    <button class="btn blue" onclick="openVerify('${d.id}')">🔍 تحقق كامل</button>
    <button class="btn approve" onclick="approveDriver('${d.id}')">✅ اعتماد</button>
    <button class="btn reject" onclick="rejectDriver('${d.id}')">❌ رفض</button>
    </div>`;
  });
  document.getElementById('pending').innerHTML=h1||"لا يوجد معلقون";

  let aSnap=await getDocs(query(collection(db,"drivers"),where("status","==","approved")));
  let hA="";
  aSnap.forEach(d=>{
    let o=d.data(); driversCache[d.id]=o;
    hA+=`<div class="card" style="border:1px solid #27ae60">✅ <b>${o.name}</b> - ${o.phone} <button class="btn blue" onclick="openVerify('${d.id}')">عرض</button></div>`;
  });
  document.getElementById('approved').innerHTML=hA||"لا يوجد معتمدون";

  let rSnap=await getDocs(collection(db,"requests"));
  let h2="";
  rSnap.forEach(d=>{
    let o=d.data();
    h2+=`<div class="card"><b>${o.name} - ${o.phone}</b> | ${o.mouqataa} → ${o.destArea} | ${o.status} | 💰 ${o.price} MRU</div>`;
  });
  document.getElementById('reqs').innerHTML=h2;
}

window.openVerify=(id)=>{
  let o=driversCache[id];
  if(!o) return;
  document.getElementById('verifyContent').innerHTML=`
  <p><b>الاسم:</b> ${o.name}</p>
  <p><b>الهاتف:</b> ${o.phone}</p>
  <p><b>السيارة:</b> ${o.vehicle}</p>
  <p><b>اللوحة:</b> ${o.plate}</p>
  <img src="${o.photoBase64||''}" style="width:100%;border-radius:10px;margin-top:10px">
  <img src="${o.idPhotoBase64||''}" style="width:100%;border-radius:10px;margin-top:10px">
  <div style="display:flex;gap:8px;margin-top:10px">
  <button class="btn approve" style="flex:1" onclick="approveDriver('${id}');closeModal()">✅ اعتماد</button>
  <button class="btn reject" style="flex:1" onclick="rejectDriver('${id}');closeModal()">❌ رفض</button>
  </div>`;
  document.getElementById('verifyModal').classList.add('active');
};

window.closeModal=()=>document.getElementById('verifyModal').classList.remove('active');
window.approveDriver=async(id)=>{await updateDoc(doc(db,"drivers",id),{status:"approved", approvedAt:new Date()}); loadAll();};
window.rejectDriver=async(id)=>{ if(!confirm("حذف نهائيا؟")) return; await deleteDoc(doc(db,"drivers",id)); loadAll();};
</script>
</body>
</html>
