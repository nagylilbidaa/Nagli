<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - لوحة المسؤول الآمنة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{margin:0;padding:12px;background:#eef2f7}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,.07)}
#map{height:450px;border-radius:12px;border:2px solid #0a3d62}
.bar{height:14px;background:#eee;border-radius:20px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#27ae60,#2ecc71);transition:0.5s}
.btn{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;margin:3px;font-weight:bold}
.approve{background:#27ae60;color:#fff}
.reject{background:#e74c3c;color:#fff}
.blue{background:#0a3d62;color:#fff}
.preview-img{width:100%;height:160px;object-fit:cover;border-radius:10px;border:2px solid #ddd;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<h2 style="color:#0a3d62">👑 نقلي - لوحة المشرف الآمنة</h2>
<div class="card">
<input type="password" id="pass" placeholder="كلمة السر">
<button class="btn approve" onclick="login()">دخول</button>
<p style="font-size:12px">السر: naqli2026</p>
</div>

<div id="panel" style="display:none">
<div class="card" style="border:2px solid #f39c12"><h3>⏳ سائقون معلقون - يحتاجون تحقق</h3><div id="pending"></div></div>
<div class="card"><h3>✅ سائقون معتمدون ومحفوظون بأمان</h3><div id="approved"></div></div>
<div class="card"><h3>📦 طلبات الزبائن الحية</h3><div id="reqs"></div></div>
<div class="card"><h3>🗺️ تتبع الرحلات</h3><div id="map"></div></div>
</div>

<!-- نافذة التحقق -->
<div class="modal" id="verifyModal">
<div class="modal-box">
<h3 style="color:#0a3d62">🔍 تحقق من بيانات السائق</h3>
<div id="verifyContent"></div>
<button class="btn" style="background:#666;color:#fff;width:100%;margin-top:10px" onclick="closeModal()">إغلاق</button>
</div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, query, where, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let map, driversCache={};

window.login=function(){
if(pass.value!=="naqli2026") return alert("كلمة السر خطأ");
panel.style.display="block";
initMap();
loadAll();
};

function initMap(){
map=L.map('map').setView([18.0735,-15.9582],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
}

async function loadAll(){
let pSnap=await getDocs(query(collection(db,"drivers"),where("status","==","pending")));
let h1="";
pSnap.forEach(d=>{
let o=d.data(); driversCache[d.id]=o;
let photo=o.photoBase64||"";
let idPhoto=o.idPhotoBase64||"";
h1+=`<div class="card" style="border:1px solid #f39c12">
<div style="display:grid;grid-template-columns:80px 1fr;gap:10px">
<img src="${photo||'https://via.placeholder.com/80'}" class="preview-img" style="height:80px" onclick="openVerify('${d.id}')">
<div>
<b>👤 ${o.name}</b><br>📞 ${o.phone}<br>🚛 ${o.vehicle}<br>🔢 لوحة: ${o.plate}<br><small>📅 ${o.createdAt?.toDate?.()?.toLocaleString?.()||''}</small>
</div>
</div>
<div style="margin-top:10px;display:flex;gap:6px">
<button class="btn blue" onclick="openVerify('${d.id}')">🔍 تحقق كامل</button>
<button class="btn approve" onclick="approveDriver('${d.id}')">✅ اعتماد</button>
<button class="btn reject" onclick="rejectDriver('${d.id}')">❌ رفض</button>
</div>
</div>`;
});
pending.innerHTML=h1||"لا يوجد سائقون معلقون";

// المعتمدون
let aSnap=await getDocs(query(collection(db,"drivers"),where("status","==","approved")));
let hA="";
aSnap.forEach(d=>{
let o=d.data(); driversCache[d.id]=o;
hA+=`<div class="card" style="border:1px solid #27ae60">✅ <b>${o.name}</b> - ${o.phone} - ${o.vehicle} - ${o.plate} <span style="float:left"><button class="btn blue" onclick="openVerify('${d.id}')">عرض</button></span></div>`;
});
approved.innerHTML=hA||"لا يوجد معتمدون بعد";

// الطلبات
let rSnap=await getDocs(collection(db,"requests"));
let h2="";
rSnap.forEach(d=>{
let o=d.data();
h2+=`<div class="card"><b>${o.name} - ${o.phone}</b> | ${o.mouqataa} → ${o.destArea} | ${o.status}<br>💰 ${o.price} MRU | سائق: ${o.driverName||"لم يسند"}<div class="bar" style="margin:8px 0"><div style="width:${o.progress||10}%"></div></div></div>`;
});
reqs.innerHTML=h2;
}

window.openVerify=(id)=>{
let o=driversCache[id];
if(!o) return;
verifyContent.innerHTML=`
<p><b>الاسم:</b> ${o.name}</p>
<p><b>الهاتف:</b> <a href="tel:${o.phone}">${o.phone}</a> (مؤمن - لا يظهر للزبائن)</p>
<p><b>السيارة:</b> ${o.vehicle}</p>
<p><b>اللوحة:</b> ${o.plate}</p>
<p><b>الحالة:</b> ${o.status}</p>
<hr>
<p><b>📸 الصورة الشخصية:</b></p>
<img src="${o.photoBase64||''}" style="width:100%;border-radius:10px;border:2px solid #27ae60" onerror="this.src='https://via.placeholder.com/400?text=لا+يوجد+صورة'">
<p style="margin-top:12px"><b>🪪 بطاقة التعريف:</b></p>
<img src="${o.idPhotoBase64||''}" style="width:100%;border-radius:10px;border:2px solid #0a3d62" onerror="this.src='https://via.placeholder.com/400?text=لا+يوجد+صورة'">
<hr>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn approve" style="flex:1" onclick="approveDriver('${id}');closeModal()">✅ تأكيد الاعتماد</button>
<button class="btn reject" style="flex:1" onclick="rejectDriver('${id}');closeModal()">❌ رفض وحذف</button>
</div>
<p style="font-size:11px;color:#666;margin-top:10px">⚠️ معلومات السائق محفوظة بشكل آمن في Firestore ولا يمكن للزبائن رؤيتها إلا بعد قبول الطلب</p>
`;
verifyModal.classList.add('active');
};

window.closeModal=()=>verifyModal.classList.remove('active');
window.approveDriver=async(id)=>{await updateDoc(doc(db,"drivers",id),{status:"approved", approvedAt:new Date()}); loadAll();};
window.rejectDriver=async(id)=>{ if(!confirm("حذف السائق نهائيا؟")) return; await deleteDoc(doc(db,"drivers",id)); loadAll();};
</script>
</body>
</html>
