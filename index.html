<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - طلب جديد</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>body{font-family:sans-serif;padding:10px}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}button{background:#16a34a;color:#fff;font-weight:bold}#map{height:250px;border-radius:10px}</style>
</head>
<body>
<h2>طلب نقل جديد</h2>
<input id="cName" placeholder="الإسم">
<input id="cPhone" placeholder="رقم الهاتف">
<select id="carType"><option>تاكسي</option><option>واو</option><option>شاحنة 3 طن</option><option>شاحنة 10 طن فأكثر</option></select>
<select id="goodsType"><option>أثاث منزلي</option><option>مواد بناء</option><option>بضائع تجارية</option><option>أجهزة كهربائية</option><option>مواد غذائية</option></select>
<input id="goodsDesc" placeholder="وصف البضاعة">
<select id="fromW">
<option>تفرغ زينة</option><option>لكصر</option><option>تيارت</option><option>توجنين</option><option>عرفات</option><option>الميناء</option><option>الرياض</option><option>دار النعيم</option><option>السبخة</option>
</select>
<input id="fromZone" placeholder="المنطقة - الحي">
<select id="toW">
<option>تفرغ زينة</option><option>لكصر</option><option>تيارت</option><option>توجنين</option><option>عرفات</option><option>الميناء</option><option>الرياض</option><option>دار النعيم</option><option>السبخة</option>
</select>
<input id="toZone" placeholder="المنطقة المتوجه إليها">
<div id="map"></div>
<input id="price" type="number" placeholder="مبلغ الرحلة بالأوقية">
<button id="sendBtn">إرسال الطلب</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { db } from './firebase.js';
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let lat=18.0735, lng=-15.9582;
const map = L.map('map').setView([lat,lng], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker = L.marker([lat,lng], {draggable:true}).addTo(map);
marker.on('dragend', e=>{ lat=e.target.getLatLng().lat; lng=e.target.getLatLng().lng; });

// تحميل بيانات الزبون المحفوظة
const saved = JSON.parse(localStorage.getItem("naqli_customer")||"{}");
if(saved.name) document.getElementById("cName").value=saved.name;
if(saved.phone) document.getElementById("cPhone").value=saved.phone;

document.getElementById("sendBtn").onclick = async ()=>{
  const data = {
    cName: cName.value, cPhone: cPhone.value, carType: carType.value,
    goodsType: goodsType.value, goodsDesc: goodsDesc.value,
    fromW: fromW.value, fromZone: fromZone.value,
    toW: toW.value, toZone: toZone.value,
    price: price.value, lat, lng,
    status: "pending", createdAt: serverTimestamp()
  };
  if(!data.cName || !data.cPhone || !data.fromZone){ alert("أكمل البيانات"); return; }
  
  localStorage.setItem("naqli_customer", JSON.stringify({name:data.cName, phone:data.cPhone}));
  await addDoc(collection(db,"orders"), data);
  alert("تم إرسال طلبك، سيتصل بك السائق بعد موافقة المسؤول");
}
</script>
</body>
</html>
