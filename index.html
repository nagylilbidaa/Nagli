
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - الزبون</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#27ae60">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{background:#f5f7fa;margin:0;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;margin:7px 0;font-size:15px}
#map{height:380px;width:100%;border-radius:12px;border:2px solid #27ae60}
#trackMap{height:350px;width:100%;border-radius:12px;border:2px solid #0a3d62;display:none;margin-top:10px}
.price{background:#e8f5e9;border:1px dashed #27ae60;padding:12px;border-radius:10px;text-align:center;font-weight:bold;font-size:19px;margin-top:10px}
.btn{width:100%;padding:14px;background:#27ae60;color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-call-top{background:#0a3d62;text-decoration:none;display:block;text-align:center}
.btn-cancel{background:#e74c3c}
.label{font-weight:bold;margin-top:8px;display:block;color:#333}
.vehicles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.v-card{padding:14px;border-radius:12px;border:2px solid #eee;cursor:pointer;text-align:center}
.v-card.selected{border-color:#27ae60;box-shadow:0 4px 12px rgba(39,174,96,.4);transform:scale(1.02)}
.v-taxi{background:linear-gradient(135deg,#fff9c4,#ffeb3b)} .v-wawa{background:linear-gradient(135deg,#e3f2fd,#90caf9)} .v-med{background:linear-gradient(135deg,#e8f5e9,#a5d6a7)} .v-big{background:linear-gradient(135deg,#fce4ec,#f48fb1)}
#loginOverlay{position:fixed;inset:0;background:#f5f7fa;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px}
.status-bar{display:flex;justify-content:space-between;margin:10px 0}
.status-step{flex:1;text-align:center;font-size:12px;color:#999}
.status-step.active{color:#27ae60;font-weight:bold}
.status-dot{width:24px;height:24px;border-radius:50%;background:#eee;margin:0 auto 4px;display:flex;align-items:center;justify-content:center}
.status-step.active .status-dot{background:#27ae60;color:#fff}
.driver-live-card{border:2px solid #27ae60;background:linear-gradient(135deg,#f0fff4,#e8f5e9)}
</style>
</head>
<body>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js')})}</script>

<div id="loginOverlay">
  <div class="card" style="width:100%;max-width:380px;text-align:center">
    <h2 style="color:#27ae60;margin:0">🚚 نقلي</h2>
    <p>مرحبا! سجل دخولك</p>
    <label class="label" style="text-align:right">الاسم *</label><input id="loginName">
    <label class="label" style="text-align:right">رقم الهاتف *</label><input id="loginPhone" type="tel">
    <button class="btn" onclick="doLogin()">✅ دخول</button>
  </div>
</div>

<a class="btn btn-call-top" href="tel:+22232449538">📞 طلب باتصال سريع</a>
<h2 style="text-align:center;color:#27ae60">🚚 نقلي - طلب توصيل</h2>

<div class="card" id="liveStatus" style="display:none">
  <h3 style="margin:0 0 10px 0">📦 حالة طلبك</h3>
  <div class="status-bar">
    <div class="status-step active" id="st1"><div class="status-dot">1</div>تم الإرسال</div>
    <div class="status-step" id="st2"><div class="status-dot">2</div>قبول</div>
    <div class="status-step" id="st3"><div class="status-dot">3</div>في الطريق</div>
    <div class="status-step" id="st4"><div class="status-dot">4</div>تم</div>
  </div>
  <div id="driverLiveInfo"></div>
  <div id="trackMap"></div>
  <button class="btn" style="background:#ff9800" onclick="shareRide()">📤 مشاركة الرحلة</button>
</div>

<div class="card" id="orderForm">
<label class="label">الاسم الكامل *</label><input id="cName">
<label class="label">رقم الهاتف *</label><input id="cPhone">
<label class="label">نوع السيارة *</label>
<div class="vehicles">
<div class="v-card v-taxi" data-v="تاكسي">🚕<br><b>تاكسي</b><br><small>100 MRU</small></div>
<div class="v-card v-wawa selected" data-v="واوا">🛻<br><b>واوا</b><br><small>150 MRU</small></div>
<div class="v-card v-med" data-v="شاحنة متوسطة 3 طن">🚚<br><b>3 طن</b><br><small>600 MRU</small></div>
<div class="v-card v-big" data-v="شاحنة كبيرة 10 طن">🚛<br><b>10 طن</b><br><small>1000 MRU</small></div>
</div>
<label class="label">نوع البضاعة *</label><select id="gType"><option value="">اختر...</option><option>أثاث</option><option>مواد غذائية</option><option>مستندات</option><option>أجهزة</option><option>مواد بناء</option><option>أخرى</option></select>
<label class="label">وصف البضاعة *</label><textarea id="gDesc" rows="2"></textarea>
<label class="label">مكان الاستلام *</label><select id="pickM"><option value="">اختر المقاطعة...</option><option>تفرغ زينة</option><option>لكصر</option><option>تيارت</option><option>توجنين</option><option>عرفات</option><option>دار النعيم</option><option>الرياض</option><option>الميناء</option><option>السبخة</option></select>
<input id="pickArea" placeholder="الحي / قرب...">
<label class="label">المنطقة المتوجه إليها *</label><input id="destArea" placeholder="نواذيبو - كيفة...">
<div class="price" id="priceBox">💰 مبلغ الرحلة: 150 MRU جديدة - واوا</div>
<p style="font-size:12px;color:#888;text-align:center">يضاف 5 MRU لكل كم حسب موقعك على الخريطة</p>
</div>

<div class="card" id="mapCard">
<label class="label">📍 حدد موقعك على الخريطة *</label>
<div id="map"></div>
<p id="mapStatus" style="color:red;text-align:center">اضغط على الخريطة لتحديد موقعك</p>
</div>

<button class="btn" id="sendBtn">✅ إرسال الطلب الآن</button>
<button class="btn btn-cancel" id="cancelBtn" style="display:none">❌ إلغاء الطلب</button>
<div id="msg"></div>

<script>
function doLogin(){let n=loginName.value.trim(),p=loginPhone.value.trim();if(n.length<3)return alert('أدخل الاسم');if(p.length<8)return alert('رقم خاطئ');localStorage.setItem('naqli_name',n);localStorage.setItem('naqli_phone',p);loginOverlay.style.display='none';cName.value=n;cPhone.value=p;}
(function(){let a=localStorage.getItem('naqli_name'),b=localStorage.getItem('naqli_phone');if(a&&b)loginOverlay.style.display='none';})();
</script>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, deleteDoc, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const prices={"تاكسي":100,"واوا":150,"شاحنة متوسطة 3 طن":600,"شاحنة كبيرة 10 طن":1000};
let selVehicle="واوا", userLatLng=null, lastId=localStorage.getItem('naqli_lastId'), currentOrderId=lastId;
let map, marker, trackMap, driverMarker, customerMarker, unsub=null, currentDriverPos=null;

document.querySelectorAll('.v-card').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.v-card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selVehicle=c.dataset.v;calcPrice();}));

function calcPrice(){
  let base=prices[selVehicle], extra=0;
  if(userLatLng && map){
    let dist=map.distance(userLatLng, L.latLng(18.0735,-15.9582))/1000;
    extra=Math.round(dist*5);
  }
  let total=base+extra;
  priceBox.textContent=`💰 مبلغ الرحلة: ${total} MRU جديدة - ${selVehicle} ${extra?`(+${extra} مسافة)`:''}`;
  return total;
}

function initMap(){
  map=L.map('map').setView([18.0735,-15.9582],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  map.on('click',e=>{
    userLatLng=e.latlng;
    if(marker) map.removeLayer(marker);
    marker=L.marker(e.latlng).addTo(map).bindPopup("موقع الاستلام").openPopup();
    mapStatus.textContent="✅ تم تحديد الموقع";
    mapStatus.style.color="green";
    calcPrice();
  });
  setTimeout(()=>map.invalidateSize(),800);
  if(currentOrderId) startListening(currentOrderId);
}
function initTrackMap(){ if(trackMap) return; trackMap=L.map('trackMap').setView([18.0735,-15.9582],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(trackMap); }

window.addEventListener('load',initMap);
cName.value=localStorage.getItem('naqli_name')||""; cPhone.value=localStorage.getItem('naqli_phone')||"";
if(lastId) cancelBtn.style.display="block";

sendBtn.onclick=async()=>{
  let finalPrice=calcPrice();
  let data={name:cName.value.trim(),phone:cPhone.value.trim(),vehicle:selVehicle,goodsType:gType.value,goodsDesc:gDesc.value.trim(),mouqataa:pickM.value,pickArea:pickArea.value.trim(),destArea:destArea.value.trim(),price:finalPrice,customerLat:userLatLng?.lat,customerLng:userLatLng?.lng,lat:userLatLng?.lat,lng:userLatLng?.lng,status:"new",progress:10,createdAt:new Date()};
  if(!data.name||!data.phone||!data.goodsDesc||!data.mouqataa||!data.destArea||!userLatLng) return alert("أكمل البيانات وحدد موقعك على الخريطة");
  localStorage.setItem('naqli_name',data.name); localStorage.setItem('naqli_phone',data.phone);
  msg.textContent="⏳ جاري الإرسال...";
  try{
    let ref=await addDoc(collection(db,"requests"),data);
    lastId=ref.id; currentOrderId=ref.id; localStorage.setItem('naqli_lastId',lastId);
    msg.innerHTML=`<div style="background:#e8f5e9;padding:14px;border-radius:12px">✅ تم الإرسال! جاري البحث عن سائق...</div>`;
    cancelBtn.style.display="block"; orderForm.style.display='none'; mapCard.style.display='none'; sendBtn.style.display='none';
    startListening(ref.id);
  }catch(e){ msg.textContent="خطأ: "+e.message; }
};

cancelBtn.onclick=async()=>{
  let id=currentOrderId||localStorage.getItem('naqli_lastId'); if(!id) return;
  if(!confirm("إلغاء الطلب؟")) return;
  await deleteDoc(doc(db,"requests",id));
  msg.innerHTML=`<div style="background:#ffebee;padding:10px;border-radius:10px">❌ تم الإلغاء</div>`;
  cancelBtn.style.display="none"; localStorage.removeItem('naqli_lastId'); currentOrderId=null; if(unsub) unsub(); location.reload();
};

function startListening(orderId){
  liveStatus.style.display='block'; trackMap.style.display='block'; initTrackMap(); setTimeout(()=>trackMap.invalidateSize(),500);
  if(unsub) unsub();
  unsub=onSnapshot(doc(db,"requests",orderId), async snap=>{
    if(!snap.exists()){liveStatus.innerHTML="<h3>❌ تم إلغاء الطلب</h3>"; return;}
    let o=snap.data();
    document.querySelectorAll('.status-step').forEach(s=>s.classList.remove('active')); st1.classList.add('active');
    if(o.driverId||o.status!=='new') st2.classList.add('active');
    if(o.status==='on_the_way') st3.classList.add('active');
    if(o.status==='completed'){ document.querySelectorAll('.status-step').forEach(s=>s.classList.add('active')); }
    if(o.driverId){
      let drSnap=await getDoc(doc(db,"drivers",o.driverId)); let dr=drSnap.exists()?drSnap.data():{name:o.driverName,phone:o.driverPhone,vehicle:o.driverVehicle,plate:o.driverPlate,photoBase64:o.driverPhoto};
      currentDriverPos=o.driverLat?[o.driverLat,o.driverLng]:null;
      driverLiveInfo.innerHTML=`<div class="card driver-live-card"><h4 style="margin:0">🚕 السائق في الطريق إليك</h4><div style="display:flex;gap:12px;align-items:center;margin:10px 0"><img src="${dr.photoBase64||'https://via.placeholder.com/70'}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #27ae60"><div><b>${dr.name||o.driverName}</b><br>${dr.phone||o.driverPhone}<br><small>${dr.vehicle||''} - ${dr.plate||''}</small></div></div><a href="tel:${dr.phone||o.driverPhone}"><button class="btn" style="background:#0a3d62">📞 اتصال</button></a></div>`;
      if(o.driverLat&&o.driverLng){
        if(driverMarker) trackMap.removeLayer(driverMarker);
        driverMarker=L.marker([o.driverLat,o.driverLng]).addTo(trackMap).bindPopup("السائق");
        trackMap.setView([o.driverLat,o.driverLng],15);
        if(o.customerLat&&o.customerLng){
          if(customerMarker) trackMap.removeLayer(customerMarker);
          customerMarker=L.marker([o.customerLat,o.customerLng]).addTo(trackMap).bindPopup("موقعك");
        }
      }
      if(o.status==='completed'){ driverLiveInfo.innerHTML+=`<div style="background:#27ae60;color:#fff;padding:10px;border-radius:8px;text-align:center;margin-top:10px">✅ انتهت الرحلة - شكرا لك</div>`; setTimeout(()=>localStorage.removeItem('naqli_lastId'),3000); }
    }
  });
}

window.shareRide=()=>{
  let text=`تتبع رحلتي على نقلي - https://maps.google.com/?q=${currentDriverPos?currentDriverPos.join(','):''}`;
  if(navigator.share){navigator.share({title:'رحلتي',text});} else {prompt("انسخ رابط المشاركة:",text);}
};
</script>
</body>
</html>
