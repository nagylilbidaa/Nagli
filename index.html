
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نقلي - نواكشوط</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box;font-family:Tajawal,Arial}body{background:#f5f7fa;margin:0;padding:12px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}input,select,textarea{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;margin:7px 0;font-size:15px}#map{height:500px;width:100%;border-radius:12px;border:2px solid #27ae60}#trackMap{height:350px;width:100%;border-radius:12px;border:2px solid #0a3d62;display:none;margin-top:10px}.suggest-box{background:#fff;border:2px solid #27ae60;border-radius:8px;max-height:180px;overflow-y:auto;display:none;z-index:9999}.suggest-item{padding:12px;cursor:pointer;border-bottom:1px solid #eee}.suggest-item:hover{background:#e8f5e9}.route-info{background:#0a3d62;color:#fff;padding:12px;border-radius:10px;margin:10px 0;text-align:center;display:none}.price{background:#e8f5e9;border:2px dashed #27ae60;padding:12px;border-radius:10px;text-align:center;font-weight:bold;font-size:18px}.btn{width:100%;padding:14px;background:#27ae60;color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:8px}.btn-call-top{background:#0a3d62;text-decoration:none;display:block;text-align:center}.btn-cancel{background:#e74c3c}.btn-gps{background:#1a73e8}.btn-dest{background:#ff9800}.label{font-weight:bold;margin-top:8px;display:block}.vehicles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.v-card{padding:14px;border-radius:12px;border:2px solid #eee;cursor:pointer;text-align:center}.v-card.selected{border-color:#27ae60;transform:scale(1.02)}.qty-box{display:flex;align-items:center;gap:10px}.qty-btn{width:44px;height:44px;border-radius:10px;border:2px solid #27ae60;background:#fff;color:#27ae60;font-size:22px;font-weight:bold}.qty-num{flex:1;text-align:center;font-size:20px;font-weight:bold;background:#e8f5e9;padding:10px;border-radius:10px}#loginOverlay{position:fixed;inset:0;background:#f5f7fa;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px}.status-bar{display:flex;justify-content:space-between;margin:10px 0}.status-step{flex:1;text-align:center;font-size:12px;color:#999}.status-step.active{color:#27ae60;font-weight:bold}.status-dot{width:24px;height:24px;border-radius:50%;background:#eee;margin:0 auto 4px;display:flex;align-items:center;justify-content:center}.status-step.active .status-dot{background:#27ae60;color:#fff}.live-distance{background:#0a3d62;color:#fff;padding:10px;border-radius:10px;margin:8px 0;text-align:center}</style></head><body>
<div id="loginOverlay"><div class="card" style="width:100%;max-width:380px;text-align:center"><h2 style="color:#27ae60;margin:0">🚚 نقلي</h2><p>نواكشوط - Google</p><label class="label" style="text-align:right">الاسم *</label><input id="loginName"><label class="label" style="text-align:right">الهاتف *</label><input id="loginPhone"><button class="btn" onclick="doLogin()">دخول</button></div></div>
<a class="btn btn-call-top" href="tel:+22232449538">📞 اتصال سريع</a><h2 style="text-align:center;color:#27ae60">🚚 نقلي - نواكشوط فقط</h2>
<div class="card" id="liveStatus" style="display:none"><h3>📦 حالة طلبك</h3><div class="status-bar"><div class="status-step active" id="st1"><div class="status-dot">1</div>تم</div><div class="status-step" id="st2"><div class="status-dot">2</div>قبول</div><div class="status-step" id="st3"><div class="status-dot">3</div>طريق</div><div class="status-step" id="st4"><div class="status-dot">4</div>تم</div></div><div id="driverLiveInfo"></div><div id="liveDistanceBox"></div><div id="trackMap"></div><button class="btn" style="background:#ff9800" onclick="shareRide()">📤 مشاركة</button></div>
<div class="card" id="orderForm">
<label class="label">الاسم *</label><input id="cName"><label class="label">الهاتف *</label><input id="cPhone">
<label class="label">نوع السيارة *</label><div class="vehicles"><div class="v-card v-taxi" data-v="تاكسي">🚕<br><b>تاكسي</b><br>100 MRU</div><div class="v-card v-wawa selected" data-v="واوا">🛻<br><b>واوا</b><br>150 MRU</div><div class="v-card v-med" data-v="شاحنة متوسطة 3 طن">🚚<br><b>3 طن</b><br>600 MRU</div><div class="v-card v-big" data-v="شاحنة كبيرة 10 طن">🚛<br><b>10 طن</b><br>1000 MRU</div></div>
<label class="label">🔢 العدد *</label><div class="qty-box"><button class="qty-btn" onclick="changeQty(-1)">-</button><div class="qty-num" id="qtyNum">1 مركبة</div><button class="qty-btn" onclick="changeQty(1)">+</button></div><input type="hidden" id="vehicleQty" value="1">
<label class="label">نوع البضاعة *</label><select id="gType"><option value="">اختر...</option><option>أثاث</option><option>مواد غذائية</option><option>مستندات</option><option>أجهزة</option><option>مواد بناء</option><option>أخرى</option></select>
<label class="label">وصف البضاعة *</label><textarea id="gDesc" rows="2"></textarea>
<label class="label" style="color:#0a3d62">📍 المنطقة الحالية - نواكشوط *</label><select id="pickM"><option value="">اختر المقاطعة...</option><option>تفرغ زينة</option><option>لكصر</option><option>تيارت</option><option>توجنين</option><option>عرفات</option><option>دار النعيم</option><option>الرياض</option><option>الميناء</option><option>السبخة</option></select><input id="pickArea" placeholder="الحي - سيقترح مثل Google" autocomplete="off"><div id="suggestPick" class="suggest-box"></div>
<label class="label" style="color:#e67e22">🎯 الوجهة - نواكشوط *</label><select id="destM"><option value="">اختر مقاطعة الوجهة...</option><option>تفرغ زينة</option><option>لكصر</option><option>تيارت</option><option>توجنين</option><option>عرفات</option><option>دار النعيم</option><option>الرياض</option><option>الميناء</option><option>السبخة</option></select><input id="destArea" placeholder="حي الوجهة - سيقترح" autocomplete="off"><div id="suggestDest" class="suggest-box"></div>
<div id="routeInfo" class="route-info"></div><div class="price" id="priceBox">💰 150 MRU - اكتب الحي ليظهر الطريق</div></div>
<div class="card" id="mapCard"><label class="label">🗺️ الخريطة - ترسم الطريق مثل Google</label><div id="map"></div><p id="mapStatus" style="text-align:center;color:#1a73e8">اكتب الحي وسيظهر الطريق الأزرق</p><p id="destMapStatus" style="text-align:center;color:#e67e22">الطريق سيرسم تلقائيا</p><button class="btn btn-gps" id="retryBtn" style="display:none" onclick="requestLocation()">📡 GPS</button><button class="btn btn-dest" id="setDestBtn" onclick="enableDestMode()">🎯 تحديد يدوي</button></div>
<button class="btn" id="sendBtn">✅ إرسال الطلب</button><button class="btn btn-cancel" id="cancelBtn" style="display:none">❌ إلغاء</button><div id="msg"></div>
<script>function doLogin(){let n=document.getElementById('loginName').value.trim(),p=document.getElementById('loginPhone').value.trim();if(n.length<3)return alert('الاسم');if(p.length<8)return alert('هاتف');localStorage.setItem('naqli_name',n);localStorage.setItem('naqli_phone',p);document.getElementById('loginOverlay').style.display='none';document.getElementById('cName').value=n;document.getElementById('cPhone').value=p;}(function(){let a=localStorage.getItem('naqli_name'),b=localStorage.getItem('naqli_phone');if(a&&b)document.getElementById('loginOverlay').style.display='none';})();</script>
<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, deleteDoc, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const prices={"تاكسي":100,"واوا":150,"شاحنة متوسطة 3 طن":600,"شاحنة كبيرة 10 طن":1000};
let selVehicle="واوا",userLatLng=null,destLatLng=null,lastId=localStorage.getItem('naqli_lastId'),currentOrderId=lastId;
let map,marker,destMarker,trackMap,driverMarker,customerMarker,destTrackMarker,unsub=null,currentDriverPos=null,routeLine=null;
let vehicleQuantity=1,destMode=false;
const priceBoxEl=document.getElementById('priceBox'),mapStatusEl=document.getElementById('mapStatus'),destMapStatusEl=document.getElementById('destMapStatus'),retryBtnEl=document.getElementById('retryBtn'),msgEl=document.getElementById('msg'),routeInfoEl=document.getElementById('routeInfo');
const cNameEl=document.getElementById('cName'),cPhoneEl=document.getElementById('cPhone'),gTypeEl=document.getElementById('gType'),gDescEl=document.getElementById('gDesc'),pickMEl=document.getElementById('pickM'),pickAreaEl=document.getElementById('pickArea'),destMEl=document.getElementById('destM'),destAreaEl=document.getElementById('destArea'),qtyEl=document.getElementById('vehicleQty'),qtyNumEl=document.getElementById('qtyNum'),suggestPickEl=document.getElementById('suggestPick'),suggestDestEl=document.getElementById('suggestDest');
window.changeQty=(d)=>{vehicleQuantity=Math.max(1,Math.min(10,vehicleQuantity+d));qtyEl.value=vehicleQuantity;qtyNumEl.textContent=vehicleQuantity+(vehicleQuantity==1?" مركبة":" مركبات");calcPrice();};
document.querySelectorAll('.v-card').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.v-card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selVehicle=c.dataset.v;calcPrice();}));
async function fetchSuggestions(q,muq){let query=(q?q+", ":"")+(muq?muq+", ":"")+"Nouakchott, Mauritania";try{let url=`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(query)}&countrycodes=mr`;let res=await fetch(url);return await res.json();}catch(e){return [];}}
function showSuggestions(data,boxEl,inputEl,isDest){boxEl.innerHTML="";if(!data||!data.length){boxEl.style.display="none";return;}data.forEach(place=>{let div=document.createElement('div');div.className="suggest-item";div.textContent="📍 "+place.display_name.substring(0,90);div.onclick=()=>{inputEl.value=place.display_name.split(',')[0].trim();boxEl.style.display="none";setLocationFromPlace(place,isDest);};boxEl.appendChild(div);});boxEl.style.display="block";}
function setLocationFromPlace(place,isDest){let ll=L.latLng(parseFloat(place.lat),parseFloat(place.lon));if(isDest){destLatLng=ll;if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(ll,{draggable:true,icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',iconSize:[25,41]})}).addTo(map).bindPopup("🎯 "+place.display_name.substring(0,60)).openPopup();destMarker.on('dragend',e=>{destLatLng=e.target.getLatLng();drawRoute();});destMapStatusEl.textContent="✅ وجهة: "+place.display_name.substring(0,50);if(userLatLng)drawRoute();else map.setView(ll,14);}else{userLatLng=ll;if(marker)map.removeLayer(marker);marker=L.marker(ll,{draggable:true}).addTo(map).bindPopup("📍 "+place.display_name.substring(0,60)).openPopup();marker.on('dragend',e=>{userLatLng=e.target.getLatLng();drawRoute();});mapStatusEl.textContent="✅ موقعك: "+place.display_name.substring(0,50);map.setView(ll,14);if(destLatLng)drawRoute();}calcPrice();}
let timerPick,timerDest;pickAreaEl.addEventListener('input',()=>{clearTimeout(timerPick);timerPick=setTimeout(async()=>{if(pickAreaEl.value.length>=2){let s=await fetchSuggestions(pickAreaEl.value,pickMEl.value);showSuggestions(s,suggestPickEl,pickAreaEl,false);}else suggestPickEl.style.display="none";},400);});destAreaEl.addEventListener('input',()=>{clearTimeout(timerDest);timerDest=setTimeout(async()=>{if(destAreaEl.value.length>=2){let s=await fetchSuggestions(destAreaEl.value,destMEl.value);showSuggestions(s,suggestDestEl,destAreaEl,true);}else suggestDestEl.style.display="none";},400);});pickMEl.addEventListener('change',async()=>{if(pickMEl.value){let s=await fetchSuggestions("",pickMEl.value);if(s&&s[0])setLocationFromPlace(s[0],false);}});destMEl.addEventListener('change',async()=>{if(destMEl.value){let s=await fetchSuggestions("",destMEl.value);if(s&&s[0])setLocationFromPlace(s[0],true);}});
async function drawRoute(){if(!userLatLng||!destLatLng||!map)return;try{let url=`https://router.project-osrm.org/route/v1/driving/${userLatLng.lng},${userLatLng.lat};${destLatLng.lng},${destLatLng.lat}?overview=full&geometries=geojson`;let res=await fetch(url);let data=await res.json();if(data.routes&&data.routes[0]){let route=data.routes[0];let distanceKm=(route.distance/1000).toFixed(2);let durationMin=Math.round(route.duration/60);let coords=route.geometry.coordinates.map(c=>L.latLng(c[1],c[0]));if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(coords,{color:'#1a73e8',weight:6,opacity:0.9}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[50,50]});routeInfoEl.style.display="block";routeInfoEl.innerHTML=`🛣️ الطريق الأزرق مثل Google<br>📏 ${distanceKm} كم | ⏱️ ${durationMin} دقيقة<br>📍 من ${pickMEl.value} ${pickAreaEl.value} → ${destMEl.value} ${destAreaEl.value}`;let extra=Math.round(parseFloat(distanceKm)*12);let total=(prices[selVehicle]*vehicleQuantity)+extra;priceBoxEl.innerHTML=`📏 ${distanceKm} كم<br>⏱️ ${durationMin} د<br>💰 <b>${total} MRU</b> - ${selVehicle} × ${vehicleQuantity}`;mapStatusEl.textContent=`✅ الطريق مرسوم - ${distanceKm} كم`;return;}}catch(e){}if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline([userLatLng,destLatLng],{color:'#1a73e8',weight:5,dashArray:'12,12'}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[50,50]});calcPrice();}
function calcPrice(){let base=prices[selVehicle];let dist=0;if(userLatLng&&destLatLng&&map){dist=map.distance(userLatLng,destLatLng)/1000;}let extra=Math.round(dist*12);let total=(base*vehicleQuantity)+extra;if(dist>0&&(!routeInfoEl.style.display||routeInfoEl.style.display=='none')){priceBoxEl.innerHTML=`📏 ${dist.toFixed(2)} كم<br>💰 <b>${total} MRU</b>`;}else if(dist==0){priceBoxEl.innerHTML=`💰 <b>${total} MRU</b> - ${selVehicle} × ${vehicleQuantity}`;}return total;}
function initMap(){map=L.map('map').setView([18.0735,-15.9582],12);L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:['mt0','mt1','mt2','mt3']}).addTo(map);map.on('click',e=>{if(destMode){destLatLng=e.latlng;if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(e.latlng,{draggable:true,icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',iconSize:[25,41]})}).addTo(map).bindPopup("🎯 الوجهة").openPopup();destMarker.on('dragend',ev=>{destLatLng=ev.target.getLatLng();drawRoute();});destMapStatusEl.textContent="✅ يدوي";destMode=false;drawRoute();}else{if(!userLatLng){userLatLng=e.latlng;if(marker)map.removeLayer(marker);marker=L.marker(e.latlng,{draggable:true}).addTo(map).bindPopup("📍 هنا").openPopup();marker.on('dragend',ev=>{userLatLng=ev.target.getLatLng();drawRoute();});}else if(!destLatLng){destLatLng=e.latlng;if(destMarker)map.removeLayer(destMarker);destMarker=L.marker(e.latlng,{draggable:true,icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',iconSize:[25,41]})}).addTo(map).bindPopup("🎯 هنا").openPopup();destMarker.on('dragend',ev=>{destLatLng=ev.target.getLatLng();drawRoute();});drawRoute();}else{userLatLng=e.latlng;if(marker)map.removeLayer(marker);marker=L.marker(e.latlng,{draggable:true}).addTo(map).bindPopup("📍 هنا").openPopup();drawRoute();}}});setTimeout(()=>map.invalidateSize(),800);if(currentOrderId)startListening(currentOrderId);setTimeout(()=>window.requestLocation(),1200);}
window.enableDestMode=()=>{destMode=true;destMapStatusEl.textContent="👆 اضغط على الخريطة";};
window.requestLocation=()=>{if(!navigator.geolocation){mapStatusEl.textContent="❌ لا يدعم GPS";return;}mapStatusEl.textContent="⏳ GPS...";retryBtnEl.style.display="none";navigator.geolocation.getCurrentPosition(async pos=>{userLatLng=L.latLng(pos.coords.latitude,pos.coords.longitude);if(marker)map.removeLayer(marker);marker=L.marker(userLatLng,{draggable:true}).addTo(map).bindPopup("📍 GPS").openPopup();marker.on('dragend',e=>{userLatLng=e.target.getLatLng();drawRoute();});map.setView(userLatLng,15);mapStatusEl.textContent="✅ GPS تم";try{let res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);let data=await res.json();if(data&&data.display_name){mapStatusEl.textContent="✅ GPS: "+data.display_name.substring(0,70);}if(data.address){let sub=data.address.suburb||data.address.neighbourhood||"";if(sub&&!pickAreaEl.value)pickAreaEl.value=sub;}}catch(e){}if(destLatLng)drawRoute();calcPrice();},err=>{mapStatusEl.textContent="❌ فشل GPS";retryBtnEl.style.display="block";},{enableHighAccuracy:true,timeout:15000});}
function initTrackMap(){if(trackMap)return;trackMap=L.map('trackMap').setView([18.0735,-15.9582],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(trackMap);}
window.addEventListener('load',initMap);
cNameEl.value=localStorage.getItem('naqli_name')||"";cPhoneEl.value=localStorage.getItem('naqli_phone')||"";
if(lastId){document.getElementById('cancelBtn').style.display="block";}
document.getElementById('sendBtn').onclick=async()=>{
let finalPrice=calcPrice();
let data={name:cNameEl.value.trim(),phone:cPhoneEl.value.trim(),vehicle:selVehicle,vehicleQuantity:vehicleQuantity,goodsType:gTypeEl.value,goodsDesc:gDescEl.value.trim(),fromMuqataa:pickMEl.value,mouqataa:pickMEl.value,pickArea:pickAreaEl.value.trim(),toMuqataa:destMEl.value,destMuqataa:destMEl.value,destArea:destAreaEl.value.trim(),price:finalPrice,distanceKm:(userLatLng&&destLatLng?(map.distance(userLatLng,destLatLng)/1000).toFixed(2):0),customerLat:userLatLng?.lat,customerLng:userLatLng?.lng,lat:userLatLng?.lat,lng:userLatLng?.lng,fromLat:userLatLng?.lat,fromLng:userLatLng?.lng,destLat:destLatLng?.lat,destLng:destLatLng?.lng,status:"new",progress:10,createdAt:new Date()};
if(!data.name||!data.phone||!data.fromMuqataa||!data.toMuqataa||!userLatLng||!data.destLat)return alert("أكمل البيانات");
if(!data.goodsType||!data.goodsDesc)return alert("البضاعة");
let ref=await addDoc(collection(db,"requests"),data);lastId=ref.id;currentOrderId=ref.id;localStorage.setItem('naqli_lastId',lastId);
msgEl.innerHTML=`<div style="background:#e8f5e9;padding:14px;border-radius:12px;text-align:center">✅ تم!<br>📏 ${data.distanceKm} كم - من ${data.fromMuqataa} ${data.pickArea} إلى ${data.toMuqataa} ${data.destArea}</div>`;
document.getElementById('cancelBtn').style.display="block";document.getElementById('orderForm').style.display='none';document.getElementById('mapCard').style.display='none';document.getElementById('sendBtn').style.display='none';startListening(ref.id);
};
document.getElementById('cancelBtn').onclick=async()=>{let id=currentOrderId||localStorage.getItem('naqli_lastId');if(!id)return;if(!confirm("إلغاء؟"))return;await deleteDoc(doc(db,"requests",id));localStorage.removeItem('naqli_lastId');location.reload();};
function startListening(orderId){
document.getElementById('liveStatus').style.display='block';document.getElementById('trackMap').style.display='block';initTrackMap();setTimeout(()=>trackMap.invalidateSize(),500);if(unsub)unsub();
unsub=onSnapshot(doc(db,"requests",orderId),async snap=>{
if(!snap.exists()){document.getElementById('liveStatus').innerHTML="<h3>❌ ألغي</h3>";return;}
let o=snap.data();document.querySelectorAll('.status-step').forEach(s=>s.classList.remove('active'));document.getElementById('st1').classList.add('active');if(o.driverId||o.status!=='new')document.getElementById('st2').classList.add('active');if(o.status==='on_the_way')document.getElementById('st3').classList.add('active');if(o.status==='completed'){document.querySelectorAll('.status-step').forEach(s=>s.classList.add('active'));}

ckMap).bindPopup("🎯 تسليم: "+(o.toMuqataa||"")+" "+(o.destArea||""));}}}}
