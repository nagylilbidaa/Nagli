<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - الزبون</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{background:#f5f7fa;margin:0;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;margin:7px 0;font-size:15px}
#map{height:400px;width:100%;border-radius:12px;border:2px solid #27ae60;z-index:1}
.price{ background:#e8f5e9; border:1px dashed #27ae60; padding:12px; border-radius:10px; text-align:center; font-weight:bold; font-size:18px; margin-top:10px}
.btn{width:100%;padding:14px;background:#27ae60;color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-call-top{background:#0a3d62;text-decoration:none;display:block;text-align:center}
.btn-cancel{background:#e74c3c;display:none}
.label{font-weight:bold;margin-top:8px;display:block;color:#333}
.vehicles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.v-card{padding:14px;border-radius:12px;border:2px solid #eee;cursor:pointer;text-align:center;user-select:none}
.v-card.selected{border-color:#27ae60;box-shadow:0 4px 12px rgba(39,174,96,.4);transform:scale(1.02)}
.v-taxi{background:linear-gradient(135deg,#fff9c4,#ffeb3b)}
.v-wawa{background:linear-gradient(135deg,#e3f2fd,#90caf9)}
.v-med{background:linear-gradient(135deg,#e8f5e9,#a5d6a7)}
.v-big{background:linear-gradient(135deg,#fce4ec,#f48fb1)}
</style>
</head>
<body>

<a class="btn btn-call-top" href="tel:+22232448538">📞 طلب باتصال سريع - 32449538</a>
<h2 style="text-align:center;color:#27ae60">🚚 نقلي - طلب توصيل</h2>

<div class="card">
<label class="label">الاسم الكامل *</label>
<input id="cName" placeholder="مثال: محمد أحمد">
<label class="label">رقم الهاتف *</label>
<input id="cPhone" placeholder="مثال: 22201234">

<label class="label">نوع السيارة *</label>
<div class="vehicles" id="vehicles">
<div class="v-card v-taxi" data-v="تاكسي">🚕<br><b>تاكسي</b><br><small>1500 MRU</small></div>
<div class="v-card v-wawa selected" data-v="واوا">🛻<br><b>واوا</b><br><small>4000 MRU</small></div>
<div class="v-card v-med" data-v="شاحنة متوسطة 3 طن">🚚<br><b>متوسطة 3 طن</b><br><small>6000 MRU</small></div>
<div class="v-card v-big" data-v="شاحنة كبيرة 10 طن">🚛<br><b>كبيرة 10 طن</b><br><small>10000 MRU</small></div>
</div>

<label class="label">نوع البضاعة *</label>
<select id="gType"><option value="">اختر...</option><option>أثاث منزلي</option><option>مواد غذائية</option><option>مستندات وأوراق</option><option>أجهزة كهربائية</option><option>مواد بناء</option><option>أخرى</option></select>
<label class="label">وصف البضاعة *</label><textarea id="gDesc" rows="2" placeholder="مثال: ثلاجة + طاولة..."></textarea>
<label class="label">مكان الاستلام - مقاطعة نواكشوط *</label>
<select id="pickM"><option value="">اختر المقاطعة...</option><option>تفرغ زينة</option><option>لكصر</option><option>تيارت</option><option>توجنين</option><option>عرفات</option><option>دار النعيم</option><option>الرياض</option><option>الميناء</option><option>السبخة</option></select>
<label class="label">المنطقة / الحي</label><input id="pickArea" placeholder="مثال: قرب مسجد...">
<label class="label">المنطقة المتوجه إليها *</label><input id="destArea" placeholder="مثال: نواذيبو - كيفة...">
<div class="price" id="priceBox">💰 مبلغ الرحلة: 4000 MRU - واوا</div>
</div>

<div class="card">
<label class="label">📍 حدد موقعك على الخريطة - نواكشوط *</label>
<div id="map"></div>
<p id="mapStatus" style="color:red;text-align:center;margin-top:8px">اضغط على الخريطة لتحديد موقعك الحالي</p>
</div>

<button class="btn" id="sendBtn">✅ إرسال الطلب الآن</button>
<button class="btn btn-cancel" id="cancelBtn">❌ إلغاء الطلب</button>
<div id="msg"></div>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const prices={"تاكسي":1500,"واوا":4000,"شاحنة متوسطة 3 طن":6000,"شاحنة كبيرة 10 طن":10000};
let selVehicle="واوا"; let userLatLng=null; let lastId=localStorage.getItem('naqli_lastId'); let map,marker;

// ✅ إصلاح اختيار السيارات
document.querySelectorAll('.v-card').forEach(card=>{
card.addEventListener('click',()=>{
document.querySelectorAll('.v-card').forEach(c=>c.classList.remove('selected'));
card.classList.add('selected');
selVehicle=card.dataset.v;
document.getElementById('priceBox').textContent=`💰 مبلغ الرحلة: ${prices[selVehicle]} MRU - ${selVehicle}`;
});
});

function initMap(){
map=L.map('map').setView([18.0735,-15.9582],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
map.on('click',e=>{
userLatLng=e.latlng;
if(marker) map.removeLayer(marker);
marker=L.marker(e.latlng).addTo(map).bindPopup("موقع الاستلام").openPopup();
let s=document.getElementById('mapStatus');
s.textContent="✅ تم تحديد الموقع: "+e.latlng.lat.toFixed(4);
s.style.color="green";
});
setTimeout(()=>{ map.invalidateSize(); },800);
}
window.addEventListener('load',initMap);

document.getElementById('cName').value=localStorage.getItem('naqli_name')||"";
document.getElementById('cPhone').value=localStorage.getItem('naqli_phone')||"";
if(lastId) document.getElementById('cancelBtn').style.display="block";

document.getElementById('sendBtn').onclick=async()=>{
let data={
name:cName.value.trim(),phone:cPhone.value.trim(),vehicle:selVehicle,
goodsType:gType.value,goodsDesc:gDesc.value.trim(),
mouqataa:pickM.value,pickArea:pickArea.value.trim(),destArea:destArea.value.trim(),
price:prices[selVehicle],lat:userLatLng?.lat,lng:userLatLng?.lng,status:"new",progress:10,createdAt:new Date()
};
if(!data.name||!data.phone||!data.goodsDesc||!data.mouqataa||!data.destArea||!userLatLng) return alert("⚠️ أكمل جميع الحقول وحدد موقعك على الخريطة بالضغط عليها");
localStorage.setItem('naqli_name',data.name); localStorage.setItem('naqli_phone',data.phone);
msg.textContent="⏳ جاري الإرسال...";
try{
let ref=await addDoc(collection(db,"requests"),data);
lastId=ref.id; localStorage.setItem('naqli_lastId',lastId);
msg.innerHTML=`<div style="background:#e8f5e9;padding:14px;border-radius:12px;border:1px solid #27ae60">✅ تم الإرسال بنجاح يا ${data.name}!</div>`;
cancelBtn.style.display="block";
}catch(e){ msg.textContent="خطأ: "+e.message; }
};

document.getElementById('cancelBtn').onclick=async()=>{
let id=lastId||localStorage.getItem('naqli_lastId');
if(!id) return;
if(!confirm("هل تريد إلغاء طلبك؟")) return;
await deleteDoc(doc(db,"requests",id));
msg.innerHTML=`<div style="background:#ffebee;padding:10px;border-radius:10px;color:#c62828">❌ تم إلغاء الطلب</div>`;
cancelBtn.style.display="none"; localStorage.removeItem('naqli_lastId'); lastId=null;
};
</script>
</body>
</html>
