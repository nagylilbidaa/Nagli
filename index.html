
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقلي - مثل Google Maps</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Tajawal,Arial}
body{background:#f5f7fa;margin:0;padding:12px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
input,select{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:10px;margin:7px 0;font-size:15px}
#map{height:500px;width:100%;border-radius:12px;border:2px solid #27ae60}
.suggest-box{background:#fff;border:1px solid #ddd;border-radius:8px;max-height:160px;overflow-y:auto;display:none;position:relative;z-index:1000}
.suggest-item{padding:10px;cursor:pointer;border-bottom:1px solid #eee}
.suggest-item:hover{background:#e8f5e9}
.route-info{background:#0a3d62;color:#fff;padding:12px;border-radius:10px;margin:10px 0;text-align:center;font-size:16px;line-height:1.6}
.price{background:#e8f5e9;border:2px dashed #27ae60;padding:12px;border-radius:10px;text-align:center;font-weight:bold;font-size:18px}
.btn{width:100%;padding:14px;background:#27ae60;color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:8px}
.label{font-weight:bold;margin-top:8px;display:block}
.vehicles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.v-card{padding:14px;border-radius:12px;border:2px solid #eee;cursor:pointer;text-align:center}
.v-card.selected{border-color:#27ae60;transform:scale(1.02)}
.qty-box{display:flex;align-items:center;gap:10px;margin:8px 0}
.qty-btn{width:44px;height:44px;border-radius:10px;border:2px solid #27ae60;background:#fff;color:#27ae60;font-size:22px;font-weight:bold}
.qty-num{flex:1;text-align:center;font-size:20px;font-weight:bold;background:#e8f5e9;padding:10px;border-radius:10px}
#loginOverlay{position:fixed;inset:0;background:#f5f7fa;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px}
</style>
</head>
<body>
<div id="loginOverlay"><div class="card" style="width:100%;max-width:380px;text-align:center"><h2 style="color:#27ae60">🚚 نقلي</h2><p>مثل Google Maps</p><input id="loginName" placeholder="الاسم"><input id="loginPhone" placeholder="الهاتف"><button class="btn" onclick="doLogin()">دخول</button></div></div>

<div class="card" id="orderForm">
<label class="label">📍 من وين - مقاطعتك الحالية</label>
<select id="pickM"><option value="">اختر المقاطعة...</option><option>تفرغ زينة</option><option>لكصر</option><option>تيارت</option><option>توجنين</option><option>عرفات</option><option>دار النعيم</option><option>الرياض</option><option>الميناء</option><option>السبخة</option></select>
<input id="pickArea" placeholder="اكتب الحي أو الشارع - سيقترح لك مثل Google" autocomplete="off">
<div id="suggestPick" class="suggest-box"></div>

<label class="label">🎯 إلى وين - مقاطعة الوجهة</label>
<select id="destM"><option value="">اختر مقاطعة الوجهة...</option><option>تفرغ زينة</option><option>لكصر</option><option>تيارت</option><option>توجنين</option><option>عرفات</option><option>دار النعيم</option><option>الرياض</option><option>الميناء</option><option>السبخة</option></select>
<input id="destArea" placeholder="اكتب حي الوجهة - سيقترح لك" autocomplete="off">
<div id="suggestDest" class="suggest-box"></div>

<label class="label">نوع السيارة</label>
<div class="vehicles">
<div class="v-card selected" data-v="واوا">🛻<br><b>واوا</b><br>150 MRU</div>
<div class="v-card" data-v="تاكسي">🚕<br><b>تاكسي</b><br>100 MRU</div>
<div class="v-card" data-v="شاحنة متوسطة 3 طن">🚚<br><b>3 طن</b><br>600 MRU</div>
<div class="v-card" data-v="شاحنة كبيرة 10 طن">🚛<br><b>10 طن</b><br>1000 MRU</div>
</div>
<div class="qty-box"><button class="qty-btn" onclick="changeQty(-1)">-</button><div class="qty-num" id="qtyNum">1 مركبة</div><button class="qty-btn" onclick="changeQty(1)">+</button></div>

<div id="routeInfo" class="route-info" style="display:none"></div>
<div class="price" id="priceBox">💰 اكتب العنوانين ليظهر الطريق</div>
</div>

<div class="card"><div id="map"></div><p id="mapStatus" style="text-align:center;color:#1a73e8">اكتب الحي وسيظهر المسار الأزرق مثل Google Maps</p></div>
<button class="btn" id="sendBtn">✅ إرسال الطلب</button><div id="msg"></div>

<script>function doLogin(){let n=loginName.value.trim(),p=loginPhone.value.trim();if(n.length<3)return alert('الاسم');if(p.length<8)return alert('هاتف');localStorage.setItem('naqli_name',n);localStorage.setItem('naqli_phone',p);loginOverlay.style.display='none';}</script>
<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const prices={"تاكسي":100,"واوا":150,"شاحنة متوسطة 3 طن":600,"شاحنة كبيرة 10 طن":1000};
let selVehicle="واوا", vehicleQuantity=1, userLatLng=null, destLatLng=null, map, marker, destMarker, routeLine=null;
const pickMEl=document.getElementById('pickM'), pickAreaEl=document.getElementById('pickArea'), destMEl=document.getElementById('destM'), destAreaEl=document.getElementById('destArea');
const suggestPickEl=document.getElementById('suggestPick'), suggestDestEl=document.getElementById('suggestDest'), priceBoxEl=document.getElementById('priceBox'), routeInfoEl=document.getElementById('routeInfo'), mapStatusEl=document.getElementById('mapStatus');
window.changeQty=(d)=>{vehicleQuantity=Math.max(1,Math.min(10,vehicleQuantity+d)); document.getElementById('qtyNum').textContent=vehicleQuantity+" مركبة"; calcPrice();};
document.querySelectorAll('.v-card').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.v-card').forEach(x=>x.classList.remove('selected')); c.classList.add('selected'); selVehicle=c.dataset.v; calcPrice();}));

// --- Autocomplete مثل Google ---
async function fetchSuggestions(query, muqataa){
  let q = (query?query+", ":"") + (muqataa?muqataa+", ":"") + "Nouakchott, Mauritania";
  let url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}&countrycodes=mr`;
  let res = await fetch(url); let data = await res.json(); return data;
}
function showSuggestions(data, boxEl, inputEl, isDest){
  boxEl.innerHTML=""; if(!data.length){boxEl.style.display="none"; return;}
  data.forEach(place=>{
    let div=document.createElement('div'); div.className="suggest-item"; div.textContent=place.display_name.substring(0,80);
    div.onclick=()=>{ inputEl.value=place.display_name.split(',')[0]; boxEl.style.display="none"; setLocationFromPlace(place, isDest); };
    boxEl.appendChild(div);
  });
  boxEl.style.display="block";
}
function setLocationFromPlace(place, isDest){
  let ll=L.latLng(parseFloat(place.lat), parseFloat(place.lon));
  if(isDest){ destLatLng=ll; if(destMarker) map.removeLayer(destMarker); destMarker=L.marker(ll,{icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', iconSize:[25,41]})}).addTo(map).bindPopup("🎯 "+place.display_name).openPopup();}
  else{ userLatLng=ll; if(marker) map.removeLayer(marker); marker=L.marker(ll).addTo(map).bindPopup("📍 "+place.display_name).openPopup(); map.setView(ll,14);}
  drawRoute();
}
let timerPick, timerDest;
pickAreaEl.addEventListener('input', ()=>{ clearTimeout(timerPick); timerPick=setTimeout(async()=>{ if(pickAreaEl.value.length>2){ let s=await fetchSuggestions(pickAreaEl.value, pickMEl.value); showSuggestions(s, suggestPickEl, pickAreaEl, false); } }, 500); });
destAreaEl.addEventListener('input', ()=>{ clearTimeout(timerDest); timerDest=setTimeout(async()=>{ if(destAreaEl.value.length>2){ let s=await fetchSuggestions(destAreaEl.value, destMEl.value); showSuggestions(s, suggestDestEl, destAreaEl, true); } }, 500); });
pickMEl.addEventListener('change', async()=>{ if(pickMEl.value){ let s=await fetchSuggestions("", pickMEl.value); if(s[0]) setLocationFromPlace(s[0], false); } });
destMEl.addEventListener('change', async()=>{ if(destMEl.value){ let s=await fetchSuggestions("", destMEl.value); if(s[0]) setLocationFromPlace(s[0], true); } });

// --- رسم الطريق الأزرق مثل Google Maps ---
async function drawRoute(){
  if(!userLatLng || !destLatLng) return;
  try{
    // OSRM لرسم الطريق الحقيقي
    let url = `https://router.project-osrm.org/route/v1/driving/${userLatLng.lng},${userLatLng.lat};${destLatLng.lng},${destLatLng.lat}?overview=full&geometries=geojson`;
    let res = await fetch(url); let data = await res.json();
    if(data.routes && data.routes[0]){
      let route = data.routes[0];
      let distanceKm = (route.distance/1000).toFixed(2);
      let durationMin = Math.round(route.duration/60);
      let coords = route.geometry.coordinates.map(c=>L.latLng(c[1], c[0]));
      
      if(routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(coords, {color:'#1a73e8', weight:6, opacity:0.8}).addTo(map);
      map.fitBounds(routeLine.getBounds(), {padding:[40,40]});
      
      routeInfoEl.style.display="block";
      routeInfoEl.innerHTML=`🛣️ الطريق: <b>${distanceKm} كم</b> | ⏱️ الوقت: <b>${durationMin} دقيقة</b><br>📍 من ${pickMEl.value} إلى ${destMEl.value}`;
      
      let extra = Math.round(parseFloat(distanceKm)*12);
      let total = (prices[selVehicle]*vehicleQuantity)+extra;
      priceBoxEl.innerHTML=`📏 المسافة الحقيقية عبر الطريق: ${distanceKm} كم<br>⏱️ ${durationMin} دقيقة<br>💰 المبلغ: <b>${total} MRU</b> - ${selVehicle} × ${vehicleQuantity}`;
      mapStatusEl.textContent=`✅ تم رسم المسار الأزرق - ${distanceKm} كم`;
    }
  }catch(e){ console.log(e); // fallback خط مستقيم
    if(routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline([userLatLng, destLatLng], {color:'#1a73e8', weight:4, dashArray:'10,10'}).addTo(map);
    let dist = map.distance(userLatLng, destLatLng)/1000;
    routeInfoEl.style.display="block";
    routeInfoEl.innerHTML=`📏 مسافة مباشرة: ${dist.toFixed(2)} كم (لا يوجد طريق)`;
    calcPrice();
  }
}
function calcPrice(){ if(userLatLng && destLatLng && map){ let d=map.distance(userLatLng,destLatLng)/1000; let total=(prices[selVehicle]*vehicleQuantity)+Math.round(d*12); priceBoxEl.innerHTML=`💰 ${total} MRU - ${d.toFixed(1)} كم`; return total;} return prices[selVehicle]*vehicleQuantity; }
function initMap(){ map=L.map('map').setView([18.0735,-15.9582],12); L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20,subdomains:['mt0','mt1','mt2','mt3']}).addTo(map); map.on('click',e=>{ if(!userLatLng){ userLatLng=e.latlng; if(marker) map.removeLayer(marker); marker=L.marker(e.latlng).addTo(map).bindPopup("📍 من هنا").openPopup(); } else { destLatLng=e.latlng; if(destMarker) map.removeLayer(destMarker); destMarker=L.marker(e.latlng,{icon:L.icon({iconUrl:'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', iconSize:[25,41]})}).addTo(map).bindPopup("🎯 إلى هنا").openPopup(); drawRoute(); } }); setTimeout(()=>map.invalidateSize(),800); }
window.addEventListener('load',initMap);
document.getElementById('sendBtn').onclick=async()=>{
  if(!userLatLng||!destLatLng) return alert("حدد العنوانين - سيقترح لك مثل Google");
  let data={name:localStorage.getItem('naqli_name')||'زبون', phone:localStorage.getItem('naqli_phone')||'', vehicle:selVehicle, vehicleQuantity:vehicleQuantity, fromMuqataa:pickMEl.value, pickArea:pickAreaEl.value, toMuqataa:destMEl.value, destArea:destAreaEl.value, customerLat:userLatLng.lat, customerLng:userLatLng.lng, destLat:destLatLng.lat, destLng:destLatLng.lng, lat:userLatLng.lat, lng:userLatLng.lng, price:calcPrice(), status:"new", createdAt:new Date()};
  await addDoc(collection(db,"requests"),data); alert("✅ تم الإرسال - المسار مرسوم");
};
</script>
</body>
</html>
